<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>แนบสลิปการโอนเงิน</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap');
:root{
  --gd:#1a5c2a; --gm:#2e7d32; --gp:#e8f5e9; --gb:#c8e6c9;
  --g6:#757575; --g8:#424242; --td:#1b2e1c;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Sarabun',sans-serif;background:#f5f5f5;color:var(--td);min-height:100vh;
  display:flex;align-items:center;justify-content:center;padding:20px;}
.card{background:#fff;border-radius:20px;box-shadow:0 4px 20px rgba(0,0,0,.08);max-width:400px;width:100%;overflow:hidden;position:relative;}
.hd{background:linear-gradient(135deg,var(--gd),#66bb6a);padding:28px 24px;text-align:center;color:#fff;position:relative;}
.close-x{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:50%;
  background:rgba(255,255,255,.2);border:none;color:#fff;font-size:18px;line-height:1;
  cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:'Sarabun',sans-serif;}
.close-x:active{background:rgba(255,255,255,.35);}
.brand-logo{width:56px;height:70px;object-fit:contain;margin:0 auto 8px;display:block;background:#fff;border-radius:8px;padding:2px;}
.hd h1{font-size:18px;font-weight:600;}
.hd p{font-size:13px;opacity:.9;margin-top:4px;}
.bd{padding:24px;}
.fg{display:flex;flex-direction:column;gap:6px;margin-bottom:18px;}
.fg label{font-size:13px;font-weight:600;color:var(--g8);}
.fc{height:46px;padding:0 14px;border:1.5px solid #eee;border-radius:10px;font-size:15px;
  font-family:'Sarabun',sans-serif;width:100%;}
.fc:focus{outline:none;border-color:var(--gm);}
.sbox{border:1.5px dashed var(--gb);border-radius:12px;padding:20px;text-align:center;background:var(--gp);}
.sbox img{max-width:100%;max-height:220px;border-radius:8px;margin-bottom:10px;}
.sbu{padding:10px 20px;border:none;border-radius:8px;background:var(--gm);color:#fff;font-size:14px;
  font-weight:600;font-family:'Sarabun',sans-serif;cursor:pointer;}
.btn{width:100%;height:48px;border:none;border-radius:10px;background:var(--gm);color:#fff;
  font-size:15px;font-weight:600;font-family:'Sarabun',sans-serif;cursor:pointer;margin-top:16px;}
.btn:disabled{opacity:.5;}
.btn-outline{background:#fff;color:var(--gm);border:1.5px solid var(--gm);}
.state{text-align:center;padding:20px 0;}
.state .ico{font-size:40px;margin-bottom:12px;}
.err{background:#ffebee;color:#c62828;border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:16px;display:none;}
.err.show{display:block;}
.sh{display:none;}
</style>
</head>
<body>

<div class="card">
  <button type="button" class="close-x" id="closeXBtn" onclick="closeThisPage()" aria-label="ปิดหน้านี้">✕</button>
  <div class="hd">
    <img class="brand-logo" src="https://toinatadee.github.io/Order/logo-em-o-cha.png" alt="Em-O-Cha">
    <h1>📎 แนบสลิปการโอนเงิน</h1>
    <p>เลขที่ออเดอร์: <b id="orderIdDisplay"></b></p>
  </div>
  <div class="bd">

    <div id="formState">
      <div class="err" id="errBox"></div>
      <div class="fg">
        <label>รูปสลิปการโอนเงิน</label>
        <div class="sbox" id="sboxWrap">
          <input type="file" id="slipFile" accept="image/*" style="display:none" onchange="handleFile(this)">
          <div id="slipPreview">
            <p style="font-size:13px;color:var(--g6);margin-bottom:10px">ยังไม่ได้เลือกรูป</p>
            <button type="button" class="sbu" onclick="document.getElementById('slipFile').click()">📷 เลือกรูปสลิป</button>
          </div>
        </div>
      </div>
      <button class="btn" id="submitBtn" onclick="submitSlip()" disabled>✅ ยืนยันแนบสลิป</button>
    </div>

    <div id="successState" class="sh state">
      <div class="ico">🎉</div>
      <p style="font-weight:600">แนบสลิปสำเร็จ!</p>
      <p style="color:var(--g6);font-size:14px;margin-top:6px">ทีมงานจะตรวจสอบและดำเนินการจัดส่งให้เร็วที่สุด</p>
      <p style="color:var(--gd);font-weight:600;margin-top:14px">🙏 ขอบคุณที่รักเอมโอชา ในทุกๆ วันนะคะ</p>
      <p id="closeCountdown" style="font-size:12px;color:var(--g6);margin-top:16px"></p>
      <p style="font-size:13px;color:var(--g6);margin-top:14px">ปิดหน้าต่างนี้ได้เลยค่ะ 🙏</p>
    </div>

    <div id="errorState" class="sh state"></div>

  </div>
</div>

<script>
// ⚡ แก้ปัญหาเดิม (13/8/69): แท็ก <script src="...sdk.js"> ปกติ (ไม่มี defer/async) เป็น script แบบ
// บล็อกการโหลดหน้า (render-blocking) — เบราว์เซอร์ต้องรอโหลด+รัน SDK จาก LINE ให้เสร็จก่อน ถึงจะไปแตะ
// โค้ดส่วนที่เหลือของหน้านี้ได้เลยสักบรรทัด (รวมถึงฟังก์ชันเลือกรูป/กดอัปโหลด) ถ้าเน็ตช้าหรือ LINE server
// ตอบช้าเป็นพิเศษ ปุ่มต่างๆ บนหน้าจะกดไม่ได้เลยจนกว่าจะโหลดเสร็จ ทั้งที่ผู้ใช้เห็นหน้าตาการ์ดครบแล้ว
//
// ลองใส่ defer ให้ script tag ตัวนั้นดูก่อน แต่พบว่า defer ไม่มีผลกับ inline script ที่ไม่มี src (ตาม
// สเปกเบราว์เซอร์) ทำให้ inline script อันนี้ (ที่ไม่มี defer) จะรันก่อน SDK โหลดเสร็จอยู่ดี จนตัวแปร liff
// ยังไม่มีค่าตอนเรียก liff.init() (พัง) — แก้ให้ถูกต้องจริงๆ โดยโหลด SDK แบบ inject เข้ามาด้วยโค้ดเองแทน
// ฟังก์ชันหลักของหน้านี้ (handleFile/submitSlip/closeThisPage) ประกาศพร้อมใช้งานได้ทันทีไม่ต้องรอ SDK เลย
// ส่วน liff.init() จะถูกเรียกก็ต่อเมื่อ SDK โหลดเสร็จจริงๆ เท่านั้น (ผ่าน onload ของ script ที่ inject เอง)
//
// ⚡ พบจากการทดสอบจริงในแอป LINE บน iOS (13/8/69): window.open() บน iOS ของแอป LINE มักไม่ได้เปิด "หน้าต่าง
// ใหม่" จริงๆ แต่เป็นการนำทางหน้าเดิม (หน้าร้าน) ไปยัง URL นี้แทน (มีแค่หน้าเดียวตลอดเวลา ไม่ใช่ 2 หน้าต่าง)
// ผลคือ window.opener ไม่มีค่าตั้งแต่แรกอยู่แล้วในสภาพแวดล้อมนี้ (ปิดตัวเองผ่าน window.close() ไม่ได้แน่นอน
// ไม่ว่าจะพยายามกี่ครั้ง) — จึงเพิ่มโหลด LIFF SDK เข้ามาในหน้านี้ด้วย แล้วลองปิดผ่าน liff.closeWindow()
// เป็นทางเลือกที่สอง เพราะเป็นคำสั่งที่คุยตรงกับแอป LINE เอง (ไม่ผ่านกลไก window.opener ของเบราว์เซอร์เลย)
// ถึงจะเปิดมาจาก URL ที่ไม่ตรงกับ Endpoint URL ที่ลงทะเบียนไว้ของ LIFF ID นี้ก็ตาม ยังทำงานได้ตราบใดที่ยัง
// อยู่ในเบราว์เซอร์ในแอป LINE เดิม (liff.isInClient() เป็นจริง) — ใช้ LIFF ID เดียวกับหน้าร้าน (Order/index.html)
// เพราะจากการทดสอบพบว่ายังอยู่ใน context ของ LIFF ตัวเดิมต่อเนื่องมา ไม่ได้หลุดออกไปเป็นเบราว์เซอร์แยก
var SLIP_LIFF_ID = '2010892131-3XYQXNzq';
var liffReady_ = false;
var liffInClient_ = false;

var liffSdkScript_ = document.createElement('script');
liffSdkScript_.src = 'https://static.line-scdn.net/liff/edge/2/sdk.js';
liffSdkScript_.onload = function(){
  try {
    liff.init({ liffId: SLIP_LIFF_ID }).then(function(){
      liffReady_ = true;
      liffInClient_ = !!(liff.isInClient && liff.isInClient());
    }).catch(function(){ /* init ไม่สำเร็จ (เช่น เปิดนอกแอป LINE) — ไม่เป็นไร ใช้ window.close() แทนต่อไป */ });
  } catch (e) { /* ไม่ควรเกิดขึ้นเลยเพราะเรียกหลัง onload แล้ว แต่กันไว้เผื่อ */ }
};
document.head.appendChild(liffSdkScript_);

// ⚠️ Apps Script Web App URL เดียวกับที่หน้าอื่นๆ ในระบบใช้ (index.html หน้าสมัครสมาชิก/หน้าสั่งซื้อ)
// ถ้าเคย Deploy เวอร์ชันใหม่จน URL เปลี่ยน ต้องมาแก้ตรงนี้ให้ตรงกันด้วย
var API_URL = 'https://script.google.com/macros/s/AKfycbzfhB83ccV-gnji-A_-rNnGmM7K1O4XnV9w6NBcTRm_d_fN_raU6BjBwyOIWz-SIeL7Bw/exec';

// เดิมหน้านี้เป็นหน้าที่ Apps Script เสิร์ฟเอง (ผ่าน doGet ?page=uploadSlip) รับค่า orderId ผ่านตัวแปร
// เทมเพลตของ Apps Script (<?= orderId ?>) ได้ตรงๆ — ตอนนี้ย้ายมาเป็นหน้า static บน GitHub Pages แล้ว จึง
// ต้องอ่าน orderId จาก query string ของ URL แทน (เหมือนกับที่ลิงก์จากหน้าสั่งซื้อส่งมาให้)
var ORDER_ID = new URLSearchParams(location.search).get('orderId') || '';
document.getElementById('orderIdDisplay').textContent = ORDER_ID;
var slipData = null;

// เช็คว่า "หน้านี้ถูกเปิดโดยสคริปต์" หรือไม่ (window.opener มีค่า = ถูกเปิดผ่าน window.open() จากหน้าร้าน)
// เก็บไว้เผื่ออนาคตต้องใช้วินิจฉัย — ตอนนี้ไม่ได้ใช้ตัดสินใจอะไรอีกแล้ว (ดูคอมเมนต์ SLIP_LIFF_ID ด้านบน:
// บน iOS/แอป LINE window.opener มักไม่มีค่าอยู่แล้วแม้เปิดถูกทาง จึงเปลี่ยนไปพึ่ง liff.closeWindow() เป็นหลัก
// แทน ปุ่มปิดจึงแสดงไว้เสมอไม่ว่า window.opener จะมีค่าหรือไม่ก็ตาม)
var canSelfClose = !!window.opener;

function closeThisPage(){
  // ฟังก์ชันนี้ถูกเรียกได้ 2 ทาง: กดปุ่ม หรือ countdown หมดเวลา — ลองปิดทั้ง liff.closeWindow() (ถ้าอยู่
  // ในแอป LINE) และ window.close() (เผื่อกรณีเปิดผ่านเบราว์เซอร์ปกติที่มี opener จริง) พร้อมกันทั้งคู่
  try {
    if (liffReady_ && liffInClient_) { liff.closeWindow(); }
  } catch (e) { /* ปิดผ่าน LIFF ไม่สำเร็จ — ลองทางที่เหลือต่อไปตามปกติ */ }
  window.close();
  // เผื่อทั้งสองทางปฏิเสธ (เช่น liff ยังไม่ init เสร็จตอนกดปุ่มพอดี หรือไม่มี opener จริง) — โชว์ข้อความ
  // ให้ปิดเองแทน กันหน้าจอค้างเงียบๆ ไม่บอกอะไรผู้ใช้เลย
  setTimeout(function(){
    var el = document.getElementById('closeCountdown');
    if (el) el.textContent = 'ปิดหน้านี้ได้เลยค่ะ 🙏';
  }, 400);
}


function showErrorState(msg){
  document.getElementById('errorState').innerHTML = '<div class="ico">⚠️</div><p style="color:#c62828">' + msg.replace(/</g,'&lt;') + '</p>';
  document.getElementById('formState').classList.add('sh');
  document.getElementById('errorState').classList.remove('sh');
}

if (!ORDER_ID) {
  showErrorState('ไม่พบเลขที่ออเดอร์ — กรุณาเปิดลิงก์นี้จากปุ่ม "แนบสลิป" ในหน้าสั่งซื้อเท่านั้น');
}

function handleFile(inp){
  var file = inp.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e){
    var img = new Image();
    img.onload = function(){
      var maxW = 1000, maxH = 1000;
      var w = img.width, h = img.height;
      if (w > maxW) { h = Math.round(h * maxW / w); w = maxW; }
      if (h > maxH) { w = Math.round(w * maxH / h); h = maxH; }
      var canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      var compressed = canvas.toDataURL('image/jpeg', 0.75);
      var parts = compressed.split(',');
      slipData = { base64: parts[1], fileName: 'slip.jpg', mimeType: 'image/jpeg' };
      document.getElementById('slipPreview').innerHTML =
        '<img src="' + compressed + '"><br>' +
        '<button type="button" class="sbu" onclick="document.getElementById(\'slipFile\').click()">🔄 เปลี่ยนรูป</button>';
      document.getElementById('submitBtn').disabled = false;
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

// เดิมหน้านี้เรียก google.script.run.uploadShopSlip(...) ได้ตรงๆ เพราะ Apps Script เป็นคนเสิร์ฟหน้านี้เอง
// (ไม่ติดปัญหาข้าม domain) — ตอนนี้ย้ายมาอยู่บน GitHub แล้ว ต้องยิงผ่าน fetch() POST ไปที่ doPost() ของ
// Apps Script แทน (เหมือนวิธีที่หน้าสมัครสมาชิกใช้ตอน registerMember) ส่ง Content-Type เป็น text/plain
// (ไม่ใช่ application/json) เพื่อเลี่ยง CORS preflight request ที่ browser ต้องใช้ตอน Content-Type เป็น
// application/json แต่ Apps Script ไม่รองรับ doOptions ที่ preflight ต้องการ
//
// ⚡ เพิ่มลองใหม่อัตโนมัติสูงสุด 3 ครั้ง เฉพาะตอนเน็ตสะดุดระดับเครือข่าย (เช่น "Load failed" บน iOS/แอป LINE,
// "Failed to fetch" บน Android) ก่อนค่อยโชว์ error ให้ผู้ใช้เห็น — ไม่ลองใหม่ถ้าเซิร์ฟเวอร์ตอบกลับมาแล้วแต่
// เป็น error ทางธุรกิจ (เช่น "ไม่พบเลขที่ออเดอร์นี้") เพราะลองใหม่กี่ครั้งก็ไม่มีทางสำเร็จ มีแต่จะทำให้ผู้ใช้
// รอนานขึ้นเฉยๆ โดยไม่ได้ประโยชน์ — ระหว่างลองใหม่ ปุ่มยังคงเป็น disabled/"กำลังอัปโหลด..." อยู่เหมือนเดิม
// ผู้ใช้จะไม่เห็นความต่างอะไรเลย นอกจากโอกาสที่จะไม่ต้องกดยืนยันซ้ำเองเวลาเน็ตสะดุดแค่แป๊บเดียว
function uploadSlipAttempt_(attempt){
  return fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify({ action: 'uploadShopSlip', orderId: ORDER_ID, base64: slipData.base64, fileName: slipData.fileName, mimeType: slipData.mimeType })
  })
    .then(function(res){ return res.text(); })
    .then(function(text){
      try { return JSON.parse(text); } catch (parseErr) { throw new Error('ระบบตอบกลับไม่ถูกต้อง (ไม่ใช่ JSON) — ลองใหม่อีกครั้ง'); }
    })
    .catch(function(networkErr){
      // เข้าตรงนี้เฉพาะตอน fetch() ล้มเหลวระดับเครือข่าย (ไม่ได้รับ response เลย) — ลองใหม่แบบเงียบๆ
      // ถ้ายังไม่ครบ 3 ครั้ง (เว้นระยะสั้นๆ กันยิงรัวเกินไปตอนเน็ตหลุดจริงจัง)
      if (attempt < 3) {
        return new Promise(function(resolve){
          setTimeout(function(){ resolve(uploadSlipAttempt_(attempt + 1)); }, attempt * 700);
        });
      }
      throw networkErr;
    });
}

function submitSlip(){
  if (!slipData) return;
  var btn = document.getElementById('submitBtn');
  var errBox = document.getElementById('errBox');
  errBox.classList.remove('show');
  btn.disabled = true; btn.textContent = '⏳ กำลังอัปโหลด...';

  uploadSlipAttempt_(1)
    .then(function(r){
      btn.disabled = false; btn.textContent = '✅ ยืนยันแนบสลิป';
      if (r && r.success) {
        document.getElementById('formState').classList.add('sh');
        document.getElementById('successState').classList.remove('sh');
        // แจ้งหน้าร้าน (opener) ว่าแนบสลิปสำเร็จแล้ว ให้ปิดตัวเองตามได้เลย — ส่งสัญญาณตอนนี้แทนที่จะให้
        // หน้าร้านปิดตัวเองไปก่อนหน้านี้แล้ว
        try {
          if (window.opener && !window.opener.closed) {
            window.opener.postMessage({ type: 'emocha-slip-uploaded' }, '*');
          }
        } catch (e) { /* ปิด opener ไปแล้ว/เข้าถึงไม่ได้ — ไม่กระทบการทำงานหลักของหน้านี้ */ }
      } else {
        errBox.textContent = r ? r.error : 'เกิดข้อผิดพลาด';
        errBox.classList.add('show');
      }
    })
    .catch(function(e){
      btn.disabled = false; btn.textContent = '✅ ยืนยันแนบสลิป';
      errBox.textContent = 'Error: ' + e.message;
      errBox.classList.add('show');
    });
}
</script>
</body>
</html>
