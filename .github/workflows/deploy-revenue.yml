# ส่งโค้ดใน apps-script-revenue/ ขึ้น Apps Script "Revenue Spunky Online" แล้ว deploy เวอร์ชันใหม่
# ให้ลิงก์ /exec เดิม — ทำงานเมื่อมีการ merge เข้า main ที่แก้ไฟล์ในโฟลเดอร์นี้ หรือกดรันเองที่แท็บ Actions
#
# ตั้งค่าครั้งเดียว:
#   1. เปิด Apps Script API ของบัญชีที่แก้โปรเจกต์นี้ได้: https://script.google.com/home/usersettings
#   2. บนคอมที่มี Node.js: npx @google/clasp@2.4.2 login  (ล็อกอินบัญชีเดียวกัน)
#      แล้วคัดลอกเนื้อหาไฟล์ ~/.clasprc.json (Windows: C:\Users\<ชื่อ>\.clasprc.json)
#   3. GitHub → Settings → Secrets and variables → Actions → New repository secret
#      ชื่อ CLASPRC_JSON วางเนื้อหาไฟล์นั้น
#   (ไม่บังคับ) ตั้ง Variable ชื่อ REVENUE_DEPLOYMENT_ID = รหัส AKfycb… ของ web app ถ้าโปรเจกต์มี
#   deployment มากกว่า 1 ตัว — ถ้ามีตัวเดียวระบบหาเองได้
#
# กันทับงานที่แก้ตรงใน Apps Script editor: ก่อนส่ง จะดึงโค้ดที่อยู่บน Apps Script ตอนนี้มาเทียบกับโค้ดใน
# repo ก่อนการเปลี่ยนแปลงรอบนี้ ถ้าไม่ตรงกัน (มีคนแก้ใน editor โดยไม่ผ่าน repo) จะหยุดไม่ส่ง ให้ดึงโค้ด
# ล่าสุดเข้า repo ก่อน หรือกดรันเองโดยติ๊ก force ถ้าตั้งใจเขียนทับ
name: Deploy Revenue Apps Script

on:
  push:
    branches: [main]
    paths:
      - 'apps-script-revenue/**'
      - '.github/workflows/deploy-revenue.yml'
  workflow_dispatch:
    inputs:
      force:
        description: 'เขียนทับแม้โค้ดบน Apps Script ถูกแก้นอก repo'
        type: boolean
        default: false

concurrency:
  group: deploy-revenue
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DIR: apps-script-revenue
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install clasp and credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "::error::ยังไม่ได้ตั้ง secret CLASPRC_JSON — ดูขั้นตอนที่หัวไฟล์ .github/workflows/deploy-revenue.yml"
            exit 1
          fi
          npm install -g @google/clasp@2.4.2
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json

      - name: Check Apps Script was not edited outside the repo
        env:
          FORCE: ${{ inputs.force }}
          BEFORE: ${{ github.event.before }}
        run: |
          remote="$RUNNER_TEMP/remote"; base="$RUNNER_TEMP/base"
          mkdir -p "$remote" "$base"
          cp "$DIR/.clasp.json" "$remote/"
          (cd "$remote" && clasp pull)

          # โค้ดใน repo ก่อนการเปลี่ยนแปลงรอบนี้ (กดรันเอง = เทียบกับ HEAD)
          ref=HEAD
          if [ "$GITHUB_EVENT_NAME" = push ]; then ref="$BEFORE"; fi
          if ! git cat-file -e "$ref:$DIR/.clasp.json" 2>/dev/null; then
            # โฟลเดอร์ยังไม่มีใน main ก่อนหน้า — เทียบกับ snapshot แรกที่ export มาจาก Apps Script
            ref=$(git log --diff-filter=A --format=%H -- "$DIR/.clasp.json" | tail -1)
          fi
          git archive "$ref" "$DIR" | tar -x -C "$base"

          if diff -ru --strip-trailing-cr -x .clasp.json -x .claspignore "$base/$DIR" "$remote" > "$RUNNER_TEMP/drift.diff"; then
            echo "โค้ดบน Apps Script ตรงกับ repo ($ref) — ส่งต่อได้"
          else
            head -c 20000 "$RUNNER_TEMP/drift.diff"
            if [ "$FORCE" = true ]; then
              echo "::warning::โค้ดบน Apps Script ถูกแก้นอก repo แต่เลือก force — จะเขียนทับ"
            else
              echo "::error::โค้ดบน Apps Script ถูกแก้นอก repo (ดู diff ด้านบน) — ดึงโค้ดล่าสุดเข้า repo ก่อน หรือกดรันเองแบบ force ถ้าตั้งใจเขียนทับ"
              exit 1
            fi
          fi

      - name: Push code
        working-directory: apps-script-revenue
        run: clasp push --force

      - name: Deploy new version to the web app
        working-directory: apps-script-revenue
        env:
          DEPLOYMENT_ID: ${{ vars.REVENUE_DEPLOYMENT_ID }}
        run: |
          if [ -z "$DEPLOYMENT_ID" ]; then
            clasp deployments | tee "$RUNNER_TEMP/deployments.txt"
            ids=$(grep -oE '^- [A-Za-z0-9_-]+ @[0-9]+' "$RUNNER_TEMP/deployments.txt" | awk '{print $2}')
            if [ "$(printf '%s\n' "$ids" | grep -c .)" != 1 ]; then
              echo "::error::หา deployment ของ web app ไม่ได้ชัดเจน — ตั้ง Variable REVENUE_DEPLOYMENT_ID เป็นรหัส AKfycb… จากลิงก์ /exec"
              exit 1
            fi
            DEPLOYMENT_ID="$ids"
          fi
          clasp deploy --deploymentId "$DEPLOYMENT_ID" --description "GitHub ${GITHUB_SHA::7}"
