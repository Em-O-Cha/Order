<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://static.line-scdn.net">
<link rel="preconnect" href="https://access.line.me">
<link rel="dns-prefetch" href="https://static.line-scdn.net">
<link rel="dns-prefetch" href="https://access.line.me">

<title>สั่งซื้อสินค้า</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap');
:root{
  --gd:#1a5c2a; --gm:#2e7d32; --gp:#e8f5e9; --gb:#c8e6c9;
  --g6:#757575; --g8:#424242; --td:#1b2e1c;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Sarabun',sans-serif;background:#f5f5f5;color:var(--td);min-height:100vh;padding:16px;}
.card{background:#fff;border-radius:20px;box-shadow:0 4px 20px rgba(0,0,0,.08);max-width:420px;width:100%;
  margin:0 auto;overflow:hidden;}
.hd{background:linear-gradient(135deg,var(--gd),#66bb6a);padding:24px;text-align:center;color:#fff;}
.brand-logo{width:76px;height:80px;object-fit:contain;margin:0 auto 8px;display:block;background:#fff;border-radius:10px;padding:3px;}
.hd h1{font-size:19px;font-weight:600;}
.hd p{font-size:13px;opacity:.9;margin-top:4px;}
.bd{padding:20px;}
.state{text-align:center;padding:20px 0;}
.state .ico{font-size:40px;margin-bottom:12px;}
#errorMsg{white-space:pre-line;text-align:left;font-size:13px;line-height:1.6;background:#fff3e0;border-radius:8px;padding:12px;}
.sh{display:none;}

.prod-item{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid #eee;}
.prod-item:last-child{border-bottom:none;}
.prod-name{flex:1;font-size:14px;}
.prod-price{font-size:13px;color:var(--g6);margin-top:2px;}
.qty-ctl{display:flex;align-items:center;gap:8px;}
.qty-btn{width:30px;height:30px;border-radius:8px;border:1.5px solid var(--gb);background:var(--gp);
  color:var(--gd);font-size:16px;font-weight:700;cursor:pointer;}
.qty-val{width:24px;text-align:center;font-weight:600;}

.cat-card{border:1.5px solid #eee;border-radius:14px;overflow:hidden;margin-bottom:16px;}
.cat-img{width:100%;height:150px;object-fit:cover;display:block;background:var(--gp);}
.cat-name{font-size:15px;font-weight:600;padding:12px 14px 4px;}
.cat-card .prod-item{padding:10px 14px;}

.cart-bar{position:sticky;bottom:0;background:#fff;border-top:1.5px solid #eee;padding:14px 20px;
  display:flex;justify-content:space-between;align-items:center;}
.cart-total{font-size:13px;color:var(--g6);}
.cart-total b{font-size:17px;color:var(--gd);display:block;}
.btn{padding:12px 24px;border:none;border-radius:10px;background:var(--gm);color:#fff;
  font-size:14px;font-weight:600;font-family:'Sarabun',sans-serif;cursor:pointer;}
.btn:disabled{opacity:.5;}
.btn-block{width:100%;height:48px;}
.btn-outline{background:#fff;color:var(--gm);border:1.5px solid var(--gm);}

.pay-opt{border:1.5px solid #eee;border-radius:12px;padding:14px;margin-bottom:10px;cursor:pointer;
  display:flex;align-items:center;width:100%;box-sizing:border-box;}
.pay-opt.active{border-color:var(--gm);background:var(--gp);}
.pay-opt input{margin-right:8px;}

.qr-box{text-align:center;padding:16px;background:var(--gp);border-radius:12px;margin-top:14px;}
.qr-box canvas,.qr-box img{margin:0 auto;}
.bank-box{background:var(--gp);border-radius:12px;padding:16px;margin-top:14px;font-size:14px;}
.bank-box .row{display:flex;justify-content:space-between;padding:5px 0;}
.bank-box .row span:first-child{color:var(--g6);}
.bank-box .row span:last-child{font-weight:600;color:var(--gd);}

.order-box{background:var(--gp);border-radius:12px;padding:18px;text-align:left;margin-top:10px;}
.order-box .row{display:flex;justify-content:space-between;font-size:14px;padding:5px 0;}

<div class="card">
  <div class="hd">
    <img class="brand-logo" src="logo-em-o-cha.png" alt="Em-O-Cha">

  <div class="bd">

    <div id="loadingState" class="state">

    <div id="catalogState" class="sh">
      <div id="myPrivileges" class="sh"></div>
      <div id="prodList"></div>

    <div id="checkoutState" class="sh">
      <div id="discountSummary" style="margin-bottom:16px"></div>
      <div class="fg-coupon" style="display:flex;gap:8px;margin-bottom:16px">
        <input type="text" id="couponInput" placeholder="มีโค้ดพิเศษอื่น? กรอกตรงนี้" style="flex:1;height:42px;padding:0 12px;border:1.5px solid #eee;border-radius:10px;font-size:14px;font-family:'Sarabun',sans-serif">

        <div id="savedAddressBox" class="sh" style="margin-bottom:8px">

            <input type="checkbox" id="useSavedAddressChk" checked onchange="toggleSavedAddress()" style="margin-top:3px">
            <span>ใช้ที่อยู่เดิม<br><span id="savedAddressText" style="color:var(--g6);font-size:12px;white-space:pre-line"></span></span>
          </label>
        </div>
        <textarea id="addressInput" placeholder="กรอกที่อยู่จัดส่ง (บ้านเลขที่ ถนน ตำบล/แขวง อำเภอ/เขต รหัสไปรษณีย์)" rows="3" style="width:100%;padding:10px 12px;border:1.5px solid #eee;border-radius:10px;font-size:14px;font-family:'Sarabun',sans-serif;resize:vertical;margin-bottom:8px"></textarea>
        <select id="provinceSelect" style="width:100%;height:44px;padding:0 12px;border:1.5px solid #eee;border-radius:10px;font-size:14px;font-family:'Sarabun',sans-serif;background:#fff">
          <option value="">— เลือกจังหวัด —</option>
        </select>

      <label class="pay-opt active" id="optPromptpay">
        <input type="radio" name="pay" value="promptpay" checked onchange="selectPayment('promptpay')"> 📱 สแกน QR พร้อมเพย์
      </label>
      <label class="pay-opt" id="optBank">
        <input type="radio" name="pay" value="bank" onchange="selectPayment('bank')"> 🏦 โอนเข้าบัญชีธนาคาร

      <button class="btn btn-block" style="margin-top:18px" onclick="submitOrder()" id="confirmOrderBtn">✅ ยืนยันสั่งซื้อ</button>
      <button class="btn btn-outline btn-block" style="margin-top:10px" onclick="backToCatalog()">← กลับไปเลือกสินค้าต่อ</button>
    </div>

    <div id="orderDoneState" class="sh state">
      <div class="ico">🎉</div>
      <p style="font-weight:600">สั่งซื้อสำเร็จ!</p>
      <div class="order-box" id="orderSummary"></div>
      <button class="btn btn-block" style="margin-top:16px" onclick="openSlipUploadPage()">📎 แนบสลิปการโอนเงิน</button>
      <p style="font-size:12px;color:var(--g6);margin-top:10px">กดปุ่มด้านบนเพื่อแนบสลิป — ทีมงานจะตรวจสอบและจัดส่งให้เร็วที่สุด</p>
    </div>

    <div id="errorState" class="sh state"></div>

  </div>
  <div class="cart-bar sh" id="cartBar">
    <div class="cart-total">รวม <span id="cartCount">0</span> ชิ้น<b id="cartTotal">฿0</b></div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
// ⚠️ ใส่ LIFF ID ของ "หน้าร้าน" ตรงนี้ (สร้างเป็น LIFF App ใหม่ ใต้ LINE Login Channel เดิม)
var LIFF_ID = '2010892131-3XYQXNzq';
// ⚠️ ใส่ Apps Script Web App URL ตรงนี้ (URL เดียวกับที่ใช้ในหน้าสมัครสมาชิก ลงท้าย /exec)
var API_URL = 'https://script.google.com/macros/s/AKfycby_bfO-sR2d3l55SMu62IoPQ1PkwO2AXHOKU562gEk9PhLDCR4Ml9uG2re89unqJbE/exec';
               
var currentIdToken = null;
var categories = [];
var variantList = []; // flat list ของทุกขนาดบรรจุจากทุกหมวดหมู่ รวมกันไว้ใช้อ้างอิงด้วย index (สร้างใหม่ทุกครั้งที่ renderCatalog)
var cart = {}; // { skuName: qty } — skuName คือชื่อสินค้าเต็มจากคอลัมน์ B (ตรงกับที่ระบบ Revenue ใช้)
var paymentInfo = null;
var selectedPayment = 'promptpay';
var appliedCouponCode = '';
var lastDiscountInfo = null; // { privilege, coupon, autoCoupon, couponError } จาก checkShopDiscounts ล่าสุด
// ใช้กันไม่ให้ liff.login() ถูกเรียกซ้ำไม่รู้จบบนคอมพิวเตอร์ (ดูรายละเอียดที่ startLineLogin() ด้านล่าง)
var LIFF_LOGIN_GUARD = 'emocha.shop.login-attempted';
var pendingSlipUploadUrl = ''; // URL หน้าแนบสลิปที่รอเปิดผ่าน window.open() (เซ็ตค่าไว้ตอน submitOrder สำเร็จ)

// เปิดหน้าแนบสลิปด้วย window.open() แทนการคลิกลิงก์ <a target="_blank"> ธรรมดา — สำคัญ: ต้อง window.open()
// เท่านั้นถึงจะทำให้หน้าใหม่ "รู้ว่าตัวเองถูกเปิดโดยสคริปต์" และสั่ง window.close() ปิดตัวเองได้จริงตอนแนบ
// สลิปเสร็จ ถ้าเปิดผ่านคลิกลิงก์ปกติ เบราว์เซอร์ส่วนใหญ่จะบล็อกไม่ให้สคริปต์สั่งปิดแท็บนั้น (ค้างปิดไม่ได้)
function openSlipUploadPage(){
  if (!pendingSlipUploadUrl) return;
  window.open(pendingSlipUploadUrl, '_blank');
}

function showState(id){
  ['loadingState','catalogState','checkoutState','orderDoneState','errorState'].forEach(function(s){
    document.getElementById(s).classList.toggle('sh', s !== id);
  });
  document.getElementById('cartBar').classList.toggle('sh', id !== 'catalogState');
}
function showErrorState(msg){
  document.getElementById('errorState').innerHTML = '<div class="ico">⚠️</div><div id="errorMsg">' + msg.replace(/</g,'&lt;') + '</div>';
  showState('errorState');
}

// เรียก Apps Script ผ่าน fetch() แบบ GET เสมอ (แม้แต่ action ที่เปลี่ยนแปลงข้อมูล) เพราะ POST ข้าม
// domain เจอปัญหา CORS จากการ redirect ของ Apps Script ในเบราว์เซอร์ของแอป LINE มาก่อนแล้ว
// เรียก Apps Script — พร้อมระบบ "ลองใหม่อัตโนมัติ" เมื่อเจอปัญหาชั่วคราว (เหมือนฝั่งหน้าสมาชิก)
// Apps Script บางครั้งตอบกลับมาเป็นหน้า HTML ของ Google แทน JSON โดยไม่มีสาเหตุชัดเจน แล้วลองใหม่ก็หายเอง
// จึงลองใหม่ให้เงียบๆ สูงสุด 3 ครั้งก่อน แทนที่จะเด้ง error ที่มีโค้ด HTML เต็มหน้าจอให้ลูกค้างง
function callApi(action, payload, _attempt){
  payload = payload || {};
  payload.action = action;
  var attempt = _attempt || 1;
  var MAX_ATTEMPTS = 3;
  var qs = Object.keys(payload).map(function(k){
    return encodeURIComponent(k) + '=' + encodeURIComponent(payload[k]);
  }).join('&');

  return fetch(API_URL + '?' + qs, { method: 'GET' }).then(function(res){
    return res.text().then(function(text){
      try {
        return JSON.parse(text);
      } catch (parseErr) {
        if (attempt < MAX_ATTEMPTS) {
          return new Promise(function(resolve){
            setTimeout(function(){ resolve(callApi(action, payload, attempt + 1)); }, attempt * 800);
          });
        }
        throw new Error('ระบบไม่ตอบสนองชั่วคราว กรุณาลองใหม่อีกครั้งในสักครู่');
      }
    });
  }).catch(function(networkErr){
    if (attempt < MAX_ATTEMPTS && networkErr.message.indexOf('ระบบไม่ตอบสนอง') === -1) {
      return new Promise(function(resolve){
        setTimeout(function(){ resolve(callApi(action, payload, attempt + 1)); }, attempt * 800);
      });
    }
    throw networkErr;
  });
}

// ถอด exp (เวลาหมดอายุ) ออกจาก idToken โดยไม่ต้องยิง API — เพื่อเช็คฝั่ง client ก่อนส่งไปให้เซิร์ฟเวอร์
// idToken เป็น JWT 3 ส่วนคั่นด้วยจุด ส่วนกลาง (payload) เป็น Base64URL ของ JSON ที่มีฟิลด์ exp (unix seconds)
// สำคัญ: ใช้ atob() เฉยๆ ถอดไม่ได้ เพราะ atob() คืนค่าเป็น Latin1 byte string ไม่ใช่ UTF-8 — ถ้า payload
// มีอักขระไทย (เช่น "name" ที่เป็นชื่อ LINE ของผู้ใช้ ซึ่งคนไทยส่วนใหญ่ตั้งเป็นภาษาไทย) จะถอดออกมาเพี้ยน
// จน JSON.parse() error แล้วถูกจับใน catch คืนค่า 0 กลับไป ทำให้ระบบเข้าใจผิดว่า token หมดอายุเสมอ
// (แม้จะเพิ่ง login ใหม่สดๆ ก็ตาม) จึงต้องแปลงเป็น UTF-8 อย่างถูกต้องด้วย TextDecoder ก่อน
function getIdTokenExpiryMs_(token){
  try {
    var payload = String(token).split('.')[1];
    var b64 = payload.replace(/-/g, '+').replace(/_/g, '/');
    while (b64.length % 4) b64 += '=';
    var binary = atob(b64);
    var bytes = new Uint8Array(binary.length);
    for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    var json = JSON.parse(new TextDecoder('utf-8').decode(bytes));
    return json.exp ? json.exp * 1000 : 0;
  } catch (e) {
    return 0;
  }
}

var activeAutoCoupons = []; // โปรโมชั่นอัตโนมัติที่ใช้งานอยู่ตอนนี้ (ไม่ต้องพิมพ์โค้ด) เอาไว้โชว์ราคาขีดฆ่า+ราคาแดง

function loadProducts(){
  Promise.all([
    callApi('getShopProducts'),
    callApi('getActiveCoupons').catch(function(e){ return { success: false, error: 'fetch error: ' + e.message }; })
  ])
    .then(function(results){
      var r = results[0];
      var couponsResult = results[1];
      if (!r || !r.success) { showErrorState('โหลดสินค้าไม่สำเร็จ: ' + (r ? r.error : '')); return; }
      categories = r.categories || [];
      activeAutoCoupons = (couponsResult && couponsResult.success)
        ? couponsResult.results.filter(function(c){ return c.autoApply; })
        : [];
      renderCatalog();
      showState('catalogState');
      loadMyPrivileges();
    })
    .catch(function(e){ showErrorState('เรียก API ไม่สำเร็จ: ' + e.message); });
}

// หาโปรโมชั่นอัตโนมัติที่ลดได้เยอะที่สุดสำหรับสินค้าตัวนี้ (ถ้ามีหลายโปรตรงกันพร้อมกัน) — restriction
// ว่าง = ใช้ได้ทุกสินค้า, ไม่ว่าง = ต้องมีคำนั้นอยู่ในชื่อเต็ม (ชื่อสินค้า+ขนาดบรรจุ) — ใช้ skuName เต็ม
// ไม่ใช่แค่ชื่อสินค้าเฉยๆ เพื่อให้จับคู่ได้ถูกทั้งกรณีลดทั้งสินค้า (พิมพ์แค่ชื่อสินค้า) และกรณีลดเฉพาะ
// ขนาดบรรจุใดขนาดหนึ่ง (พิมพ์ชื่อสินค้า+ขนาดเต็มๆ) — จับคู่แบบเดียวกับฝั่งเซิร์ฟเวอร์ทุกประการ
function getBestPromoPrice_(skuName, price){
  var best = null;
  activeAutoCoupons.forEach(function(c){
    if (c.restriction) {
      var keywords = c.restriction.split(',').map(function(s){ return s.trim(); }).filter(Boolean);
      var matches = keywords.some(function(kw){ return skuName.indexOf(kw) !== -1; });
      if (!matches) return;
    }
    // หมายเหตุ: ไม่เช็ค minPurchase ตรงนี้เพราะมันคือยอดขั้นต่ำ "ทั้งออเดอร์" ไม่ใช่ราคาต่อชิ้น
    // เช็คแบบต่อชิ้นจะซ่อนโปรที่จริงๆ ใช้ได้ถ้ารวมกับสินค้าอื่นในตะกร้า — ราคาที่ยืนยันจริงคำนวณที่หน้าชำระเงินอีกที
    var discounted = c.type === 'percent' ? price * (1 - c.value / 100) : Math.max(0, price - c.value);
    if (!best || discounted < best) best = discounted;
  });
  return best;
}

// ดึงสิทธิ์พิเศษของลูกค้าคนนี้ (ส่วนลด VVIP ตลอดกาล หรือสิทธิ์ที่พนักงานให้ในช่วงเวลาหนึ่งๆ) มาโชว์
// เป็นแบนเนอร์ด้านบนหน้าร้าน ให้เห็นตั้งแต่หน้าเลือกสินค้าเลย ไม่ต้องรอไปถึงหน้าชำระเงิน
function loadMyPrivileges(){
  callApi('getMyPrivileges', { idToken: currentIdToken })
    .then(function(r){
      if (!r || !r.success || !r.results || !r.results.length) return;
      var h = '<div class="bank-box" style="margin-bottom:16px;text-align:left">';
      h += '<p style="font-weight:600;margin-bottom:8px">🎖️ สิทธิพิเศษของคุณ</p>';
      r.results.forEach(function(p){
        h += '<div class="row"><span>' + escHtml(p.name) + ' (' + escHtml(p.expiry) + ')</span></div>';
      });
      h += '</div>';
      document.getElementById('myPrivileges').innerHTML = h;
      document.getElementById('myPrivileges').classList.remove('sh');
    })
    .catch(function(){});
}

// แสดงสินค้าเป็นการ์ดตามหมวดหมู่ (รูป + ชื่อหมวดหมู่) แล้วแสดงรายการขนาดบรรจุ (variant) ให้เลือกจำนวน
// ทีละอันภายใต้การ์ดนั้น — สร้าง variantList แบบ flat ใหม่ทุกครั้งที่ render เพื่อใช้ index อ้างอิงง่ายๆ
// เหมือนเดิม (แทนที่จะอ้างอิงชื่อสินค้าตรงๆ ซึ่งอาจมีอักขระพิเศษที่ใส่ใน onclick ยาก)
function renderCatalog(){
  variantList = [];
  var h = '';
  categories.forEach(function(cat){
    h += '<div class="cat-card">';
    if (cat.image) {
      h += '<img class="cat-img" src="' + escHtml(cat.image) + '" alt="' + escHtml(cat.name) + '" onerror="this.style.display=\'none\'">';
    }
    h += '<div class="cat-name">' + escHtml(cat.name) + '</div>';
    cat.variants.forEach(function(v){
      var idx = variantList.length;
      variantList.push(v);
      var promoPrice = getBestPromoPrice_(v.skuName, v.price);
      var priceHtml = promoPrice !== null
        ? '<span style="text-decoration:line-through;color:#999;margin-right:6px">฿' + v.price.toLocaleString('th-TH') + '</span><span style="color:#c62828;font-weight:700">฿' + Math.round(promoPrice).toLocaleString('th-TH') + '</span>'
        : '฿' + v.price.toLocaleString('th-TH');
      h += '<div class="prod-item">'
        + '<div style="flex:1"><div class="prod-name">' + escHtml(v.label) + '</div><div class="prod-price">' + priceHtml + '</div></div>'
        + '<div class="qty-ctl">'
        + '<button class="qty-btn" onclick="changeQty(' + idx + ',-1)">−</button>'
        + '<span class="qty-val" id="qty_' + idx + '">0</span>'
        + '<button class="qty-btn" onclick="changeQty(' + idx + ',1)">+</button>'
        + '</div></div>';
    });
    h += '</div>';
  });
  document.getElementById('prodList').innerHTML = h || '<p style="color:var(--g6);text-align:center">ยังไม่มีสินค้า</p>';
}

function escHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function findVariant(skuName){
  return variantList.find(function(v){ return v.skuName === skuName; });
}

function changeQty(idx, delta){
  var skuName = variantList[idx].skuName;
  var cur = cart[skuName] || 0;
  cur = Math.max(0, cur + delta);
  if (cur === 0) delete cart[skuName]; else cart[skuName] = cur;
  document.getElementById('qty_' + idx).textContent = cur;
  updateCartBar();
}

function updateCartBar(){
  var count = 0, total = 0;
  Object.keys(cart).forEach(function(skuName){
    var v = findVariant(skuName);
    if (!v) return;
    count += cart[skuName];
    total += cart[skuName] * v.price;
  });
  document.getElementById('cartCount').textContent = count;
  document.getElementById('cartTotal').textContent = '฿' + total.toLocaleString('th-TH');
  document.getElementById('checkoutBtn').disabled = count === 0;
}

function backToCatalog(){ excludedPrivilegeRowIndexes = []; showState('catalogState'); }

// ครอบ Promise ด้วยเวลาจำกัด — ถ้าไม่เสร็จภายในเวลาที่กำหนด จะ reject ออกมาเองพร้อมข้อความ กันปัญหา
// "กดแล้วไม่เกิดอะไรขึ้นเลย ค้างอยู่แบบนั้นตลอดไป" ซึ่งเกิดได้ถ้า fetch() ค้างรอ response ไม่มีวันจบ
// (เช่น ปัญหาเครือข่าย/DNS บางกรณีที่เบราว์เซอร์ไม่แจ้ง error ทันที) — อย่างน้อยผู้ใช้จะได้เห็นข้อความ
// แทนที่จะรอเก้อไม่รู้จบ
function withTimeout_(promise, ms, message){
  return Promise.race([
    promise,
    new Promise(function(_, reject){ setTimeout(function(){ reject(new Error(message)); }, ms); })
  ]);
}

function goToCheckout(){
  // ดึง idToken ครั้งเดียว แล้วยิงทั้ง 3 คำขอพร้อมกัน (แทนที่จะรอทีละอันต่อกันเป็นทอดๆ) — ลดเวลารอได้มาก
  // เพราะ checkShopDiscounts และ getMyShippingAddress ต่างก็ต้องยืนยันตัวตนกับ LINE (ยิง API ภายนอก)
  // ถ้าเรียกแยกกันคนละรอบจะเสียเวลายืนยันซ้ำ 2 ครั้ง ทั้งที่ใช้ idToken ตัวเดียวกันได้เลย
  var btn = document.getElementById('checkoutBtn');
  btn.disabled = true; var originalBtnText = btn.textContent; btn.textContent = '⏳ กำลังโหลด...';

  var flow = getFreshIdToken().then(function(idToken){
    return Promise.all([
      callApi('getShopPaymentInfo').then(function(r){ if (r && r.success) paymentInfo = r; }),
      refreshDiscounts(idToken),
      loadSavedAddress(idToken)
    ]);
  });

  withTimeout_(flow, 15000, 'หมดเวลารอ (เกิน 15 วินาที) — เครือข่ายอาจมีปัญหา หรือ Apps Script ตอบช้าผิดปกติ ลองกดใหม่อีกครั้ง')
    .then(function(){
      btn.disabled = false; btn.textContent = originalBtnText;
      showState('checkoutState');
    }).catch(function(e){
      btn.disabled = false; btn.textContent = originalBtnText;
      if (e && e.alreadyShown) return; // ข้อความที่มีประโยชน์กว่า (เช่น เรื่อง third-party cookies) แสดงไปแล้ว ไม่ต้องทับ
      var reason = (e && e.message) ? e.message : 'ไม่ทราบสาเหตุ';
      showErrorWithDiagnostics_('โหลดข้อมูลการชำระเงินไม่สำเร็จ: ' + reason);
    });
}

// เช็คส่วนลด (สิทธิ์ส่วนบุคคล + คูปองที่พิมพ์เอง หรือโปรโมชั่นอัตโนมัติถ้าไม่ได้พิมพ์อะไร) — เรียกตอน
// เข้าหน้าเช็คเอาท์ครั้งแรก และตอนกดปุ่ม "ใช้โค้ด" (เช็คโค้ดที่พิมพ์เพิ่ม) จำนวนที่แสดงเป็นแค่ตัวช่วย
// พรีวิว ของจริงคำนวณใหม่อีกครั้งฝั่งเซิร์ฟเวอร์ตอนกดยืนยันสั่งซื้อเสมอ
// รับ idTokenParam ได้ (เผื่อมีอยู่แล้วจาก goToCheckout จะได้ไม่ต้องไปขอซ้ำ) ถ้าไม่ส่งมาจะไปขอเองตามปกติ
var excludedPrivilegeRowIndexes = []; // ถ้าลูกค้ากด "ลบ" สิทธิ์พิเศษออกจากออเดอร์นี้ (ยังไม่อยากใช้ตอนนี้
// เก็บไว้ใช้ครั้งหน้า) จะเก็บ "เลขแถว" (rowIndex) ของสิทธิ์เหล่านั้นไว้ในอาร์เรย์นี้ (ลบได้มากกว่า 1 รายการ
// พร้อมกัน) แล้วส่งไปบอกเซิร์ฟเวอร์ให้ข้ามสิทธิ์เหล่านี้ในการคำนวณ — ใช้ "เลขแถว" แทน "ชื่อสิทธิ์" เพราะถ้า
// ลูกค้าแลกของรางวัลชิ้นเดียวกันซ้ำ 2 ครั้ง จะได้สิทธิ์ 2 แถวชื่อเหมือนกันเป๊ะ ถ้าอ้างอิงด้วยชื่อ กดลบอันหนึ่ง
// จะดันไปลบพร้อมกันทั้งคู่โดยไม่ตั้งใจ (เลขแถวไม่มีวันซ้ำกัน แก้ปัญหานี้ได้เด็ดขาด แต่ละรายการอิสระจากกัน
// จริงๆ) — รีเซ็ตกลับเป็นอาร์เรย์ว่างทุกครั้งที่กลับไปเลือกสินค้าใหม่ (backToCatalog) เพื่อไม่ให้ค้างข้ามไป
// ออเดอร์ถัดไปโดยไม่ตั้งใจ

function refreshDiscounts(idTokenParam){
  var subtotal = getCartTotal();
  var items = Object.keys(cart).map(function(name){ return { name: name, qty: cart[name] }; });
  var itemsB64 = btoa(unescape(encodeURIComponent(JSON.stringify(items))));
  var tokenPromise = idTokenParam ? Promise.resolve(idTokenParam) : getFreshIdToken();
  return tokenPromise.then(function(idToken){
    return callApi('checkShopDiscounts', { idToken: idToken, couponCode: appliedCouponCode, subtotal: subtotal, itemsB64: itemsB64, excludePrivilegeName: excludedPrivilegeRowIndexes.join('|') });
  }).then(function(r){
    if (r && r.success) { lastDiscountInfo = r; }
    else { console.warn('checkShopDiscounts ล้มเหลว:', r && r.error); }
    renderDiscountSummary();
    renderPaymentDetail();
  });
}

// ลูกค้ากด "ลบ" ที่บรรทัดสิทธิ์พิเศษรายการใดรายการหนึ่ง (ระบุด้วย rowIndex เฉพาะของรายการนั้น — แต่ละ
// รายการเป็นอิสระจากกันเต็มที่ กดลบ/ยกเลิกรายการไหนก็ได้ ไม่ผูกติดกับรายการอื่นแม้จะชื่อเดียวกันก็ตาม) —
// ไม่ใช้สิทธิ์นั้นกับออเดอร์นี้ (สิทธิ์ยังอยู่ครบ ใช้ครั้งหน้าได้ปกติ) ทำงานฝั่ง client ล้วนๆ ไม่ยิง API ไป
// เซิร์ฟเวอร์เลย (ข้อมูลส่วนลดของทุกสิทธิ์ที่ต้องใช้คำนวณมีอยู่ในมือแล้วทั้งหมดจาก allPrivileges ที่โหลดมา
// ก่อนหน้านี้) จึงเห็นผลทันทีไม่ต้องรอเครือข่ายเลยแม้แต่วินาทีเดียว — ค่าสุดท้ายจริงๆ ยังคงถูกคำนวณ/ตรวจสอบ
// ซ้ำอีกทีฝั่งเซิร์ฟเวอร์ตอนกดยืนยันสั่งซื้อจริงอยู่ดี (ส่ง excludedPrivilegeRowIndexes ไปด้วย) จึงมั่นใจได้
// ว่ายอดที่โชว์กับยอดที่เก็บเงินจริงตรงกันเสมอ ไม่มีช่องโหว่ให้เอาเปรียบระบบ
function removePrivilegeFromOrder(rowIndex){
  if (excludedPrivilegeRowIndexes.indexOf(rowIndex) === -1) excludedPrivilegeRowIndexes.push(rowIndex);
  recomputeAppliedPrivilegesClientSide_();
  renderDiscountSummary();
  renderPaymentDetail();
}
function undoRemovePrivilege(rowIndex){
  var idx = excludedPrivilegeRowIndexes.indexOf(rowIndex);
  if (idx !== -1) excludedPrivilegeRowIndexes.splice(idx, 1);
  recomputeAppliedPrivilegesClientSide_();
  renderDiscountSummary();
  renderPaymentDetail();
}

// รวมส่วนลดจากสิทธิ์ทุกรายการที่ยังไม่ถูกลบ จาก allPrivileges ที่มีอยู่แล้วในมือ — คำนวณฝั่ง client ล้วนๆ
// เพื่อให้เห็นผลทันทีตอนกด "ลบ"/"เอากลับมาใช้" โดยไม่ต้องรอยิง API ไปเซิร์ฟเวอร์ใหม่ทุกครั้ง (สิทธิ์ทุก
// รายการที่ไม่ถูกลบใช้ได้พร้อมกันจริงๆ ไม่ใช่เลือกใช้แค่ตัวที่ดีที่สุดตัวเดียวแบบเดิมอีกต่อไป)
function recomputeAppliedPrivilegesClientSide_(){
  if (!lastDiscountInfo || !lastDiscountInfo.allPrivileges) return;
  var applied = lastDiscountInfo.allPrivileges.filter(function(p){
    return excludedPrivilegeRowIndexes.indexOf(p.rowIndex) === -1;
  });
  lastDiscountInfo.privileges = applied;
  lastDiscountInfo.privilegeDiscount = applied.reduce(function(sum, p){ return sum + p.discount; }, 0);
}

function applyCoupon(){
  var code = document.getElementById('couponInput').value.trim();
  if (!code) return;
  appliedCouponCode = code;
  refreshDiscounts();
}

// ดึงที่อยู่จัดส่งล่าสุดของสมาชิกคนนี้ (ถ้าเคยสั่งซื้อมาก่อน) มาเสนอให้ติ๊กเลือก "ใช้ที่อยู่เดิม"
// แทนต้องพิมพ์ใหม่ทุกครั้ง — ถ้าไม่เคยมีที่อยู่บันทึกไว้เลย จะซ่อนกล่องติ๊กเลือกไปเลย เหลือแค่ช่องกรอกใหม่
// จังหวัดจะถูกเลือกไว้ล่วงหน้าให้ด้วยถ้าเคยมีบันทึกไว้ (แต่ยังแก้ไขได้เสมอ ไม่ได้ล็อกตาม checkbox ที่อยู่)
function loadSavedAddress(idTokenParam){
  if (savedAddressLoaded) return Promise.resolve();
  var tokenPromise = idTokenParam ? Promise.resolve(idTokenParam) : getFreshIdToken();
  return tokenPromise.then(function(idToken){
    return callApi('getMyShippingAddress', { idToken: idToken });
  }).then(function(r){
    savedAddressLoaded = true;
    if (r && r.success && r.province) {
      savedProvince = r.province;
      document.getElementById('provinceSelect').value = savedProvince;
    }
    if (r && r.success && r.address) {
      savedAddress = r.address;
      document.getElementById('savedAddressText').textContent = savedAddress;
      document.getElementById('savedAddressBox').classList.remove('sh');
      document.getElementById('useSavedAddressChk').checked = true;
      toggleSavedAddress();
    } else {
      document.getElementById('savedAddressBox').classList.add('sh');
      document.getElementById('addressInput').style.display = '';
    }
  }).catch(function(){
    savedAddressLoaded = true; // โหลดไม่สำเร็จก็ไม่เป็นไร แค่ให้กรอกที่อยู่ใหม่แทน ไม่ต้อง block การสั่งซื้อ
    document.getElementById('savedAddressBox').classList.add('sh');
  });
}

// สลับระหว่าง "ใช้ที่อยู่เดิม" (ซ่อนช่องกรอก) กับ "กรอกที่อยู่ใหม่" (โชว์ช่องกรอกว่างๆ ให้พิมพ์)
function toggleSavedAddress(){
  var useOld = document.getElementById('useSavedAddressChk').checked;
  var input = document.getElementById('addressInput');
  document.getElementById('optUseSavedAddress').classList.toggle('active', useOld);
  if (useOld) {
    input.style.display = 'none';
  } else {
    input.style.display = '';
    input.focus();
  }
}

}

// ค่าที่อยู่จัดส่งจริงที่จะส่งไปกับออเดอร์ — จากที่อยู่เดิม (ถ้าติ๊กเลือกไว้) หรือจากช่องกรอกใหม่
function getShippingAddressValue(){
  var chk = document.getElementById('useSavedAddressChk');
  if (chk && !chk.closest('#savedAddressBox').classList.contains('sh') && chk.checked) {
    return savedAddress;
  }
  return document.getElementById('addressInput').value.trim();
}

function getDiscountAmount(){
  if (!lastDiscountInfo) return 0;
  var d = lastDiscountInfo.privilegeDiscount || 0;
  if (lastDiscountInfo.coupon) d += lastDiscountInfo.coupon.discount;
  else if (lastDiscountInfo.autoCoupon) d += lastDiscountInfo.autoCoupon.discount;
  return Math.min(getCartTotal(), d);
}

function getShippingCost(){
  return (lastDiscountInfo && lastDiscountInfo.shippingCost) ? lastDiscountInfo.shippingCost : 0;
}

function renderDiscountSummary(){
  var wrap = document.getElementById('discountSummary');
  var subtotal = getCartTotal();
  var h = '<div class="bank-box"><div class="row"><span>ยอดสินค้า</span><span>฿' + subtotal.toLocaleString('th-TH') + '</span></div>';

  // แสดงสิทธิ์พิเศษ "ทุกรายการ" ที่ลูกค้ามี — ใช้ได้พร้อมกันทุกรายการจริงๆ (ลดได้จริงทุกอันที่ยังไม่ถูกลบ
  // ไม่ใช่เลือกใช้แค่ตัวเดียวที่ดีที่สุดแบบเดิม) แต่ละรายการลบออกจากออเดอร์นี้ได้เอง (เฉพาะสิทธิ์ที่ได้มา
  // จาก "แลกด้วยแต้ม" เท่านั้น — สิทธิ์ประเภทอื่น เช่น ของขวัญวันเกิด/สิทธิ์ที่พนักงานให้เอง ไม่ให้ลบออกจาก
  // ออเดอร์ได้เหมือนเดิม) กด "ลบ" แล้วขึ้นปุ่ม "ยกเลิก" กดกลับมาใช้ได้ทันที ส่วนลดก็กลับมาเหมือนเดิม
  var allPrivileges = (lastDiscountInfo && lastDiscountInfo.allPrivileges) || [];
  allPrivileges.forEach(function(p){
    var isExcluded = excludedPrivilegeRowIndexes.indexOf(p.rowIndex) !== -1;
    var isRedeemable = p.givenBy === 'แลกด้วยแต้ม';
    if (isExcluded) {
      h += '<div class="row" style="font-size:12px;color:var(--g6)"><span>✅ ไม่ใช้สิทธิ์ "' + escHtml(p.name) + '" ในออเดอร์นี้ (ยังใช้ได้ครั้งถัดไป)</span>'
        + '<span><button type="button" onclick="undoRemovePrivilege(' + p.rowIndex + ')" style="font-size:11px;padding:3px 8px;border-radius:6px;border:1px solid var(--gm);background:#fff;color:var(--gm);cursor:pointer">ยกเลิก</button></span></div>';
      return;
    }
    var removeBtnHtml = isRedeemable
      ? ' <button type="button" onclick="removePrivilegeFromOrder(' + p.rowIndex + ')" style="font-size:11px;padding:3px 8px;border-radius:6px;border:1px solid #c62828;background:#fff;color:#c62828;cursor:pointer">ลบ</button>'
      : '';
    // ทุกรายการที่ไม่ถูกลบ ถือว่า "ใช้จริง" ทั้งหมด (ลดได้จริงพร้อมกันทุกอัน) จึงโชว์ยอดลดตรงๆ เสมอ
    h += '<div class="row" style="align-items:center"><span>🎁 ' + escHtml(p.name) + '</span>'
      + '<span style="display:flex;align-items:center;gap:8px">-฿' + Math.round(p.discount).toLocaleString('th-TH') + removeBtnHtml + '</span></div>';
  });
  if (lastDiscountInfo && lastDiscountInfo.coupon) {
    h += '<div class="row"><span>🏷️ โค้ด ' + escHtml(lastDiscountInfo.coupon.code) + '</span><span>-฿' + Math.round(lastDiscountInfo.coupon.discount).toLocaleString('th-TH') + '</span></div>';
  } else if (lastDiscountInfo && lastDiscountInfo.autoCoupon) {
    h += '<div class="row"><span>🎉 โปรโมชั่น ' + escHtml(lastDiscountInfo.autoCoupon.code) + '</span><span>-฿' + Math.round(lastDiscountInfo.autoCoupon.discount).toLocaleString('th-TH') + '</span></div>';
  }
  if (lastDiscountInfo && lastDiscountInfo.couponError) {
    h += '<div class="row" style="color:#c62828"><span colspan="2">⚠️ ' + escHtml(lastDiscountInfo.couponError) + '</span></div>';
  }
  h += '<div class="row"><span>🚚 ค่าจัดส่ง</span><span>฿' + Math.round(getShippingCost()).toLocaleString('th-TH') + '</span></div>';
  h += '<div class="row" style="border-top:1px dashed var(--gb);margin-top:6px;padding-top:8px"><span><b>ยอดสุทธิ</b></span><span><b>฿' + getFinalTotal().toLocaleString('th-TH') + '</b></span></div>';
  h += '</div>';
  wrap.innerHTML = h;
}

function selectPayment(method){
  selectedPayment = method;
  document.getElementById('optPromptpay').classList.toggle('active', method === 'promptpay');
  document.getElementById('optBank').classList.toggle('active', method === 'bank');
  renderPaymentDetail();
}

function getCartTotal(){
  var total = 0;
  Object.keys(cart).forEach(function(name){
    var v = findVariant(name);
    if (v) total += cart[name] * v.price;
  });
  return total;
}

function getFinalTotal(){
  return Math.max(0, getCartTotal() - getDiscountAmount()) + getShippingCost();
}

function renderPaymentDetail(){
  var wrap = document.getElementById('paymentDetail');
  var total = getFinalTotal();
  if (!paymentInfo) { wrap.innerHTML = ''; return; }
  if (selectedPayment === 'promptpay') {
    wrap.innerHTML = '<div class="qr-box"><div id="qrCanvas"></div><p style="margin-top:10px;font-size:13px;color:var(--g6)">ยอดชำระ ฿' + total.toLocaleString('th-TH') + '</p></div>';
    var payload = buildPromptPayPayload(paymentInfo.promptPayId, total);
    document.getElementById('qrCanvas').innerHTML = '';
    new QRCode(document.getElementById('qrCanvas'), { text: payload, width: 200, height: 200 });
  } else {
    wrap.innerHTML = '<div class="bank-box">'
      + '<div class="row"><span>ธนาคาร</span><span>' + escHtml(paymentInfo.bankName) + '</span></div>'
      + '<div class="row"><span>เลขบัญชี</span><span>' + escHtml(paymentInfo.bankAccount) + '</span></div>'
      + '<div class="row"><span>ชื่อบัญชี</span><span>' + escHtml(paymentInfo.accountName) + '</span></div>'
      + '<div class="row"><span>ยอดโอน</span><span>฿' + total.toLocaleString('th-TH') + '</span></div>'
      + '</div>';
  }
}

// ==================== PromptPay QR (EMV QR Code) ====================
// สร้าง payload สำหรับ QR พร้อมเพย์เอง ตามมาตรฐาน EMV QRCPS Merchant Presented Mode ที่พร้อมเพย์ใช้จริง
// ไม่พึ่งบริการภายนอกใดๆ ทั้งสิ้น (ทำงานฝั่ง client ล้วนๆ ปลอดภัย ไม่มีความเสี่ยงบริการภายนอกล่ม/ปิดตัว)
function tlv(id, value){
  var length = String(value.length).padStart(2, '0');
  return id + length + value;
}
function formatPromptPayId_(id){
  id = String(id).replace(/[^0-9]/g, '');
  if (id.length === 13) {
    // เลขนิติบุคคล/บัตรประชาชน
    return { tag: '02', value: id };
  }
  if (id.length === 10 && id.charAt(0) === '0') {
    // เบอร์โทรศัพท์ -> แปลงเป็นรูปแบบสากล 0066XXXXXXXXX ตามสเปคพร้อมเพย์
    id = '66' + id.substring(1);
  }
  return { tag: '01', value: '00' + id };
}
function crc16_(data){
  var crc = 0xFFFF;
  for (var i = 0; i < data.length; i++) {
    crc ^= (data.charCodeAt(i) << 8);
    for (var j = 0; j < 8; j++) {
      if (crc & 0x8000) crc = ((crc << 1) ^ 0x1021) & 0xFFFF;
      else crc = (crc << 1) & 0xFFFF;
    }
  }
  return crc.toString(16).toUpperCase().padStart(4, '0');
}
function buildPromptPayPayload(promptPayId, amount){
  var idInfo = formatPromptPayId_(promptPayId);
  var merchantInfo = tlv('00', 'A000000677010111') + tlv(idInfo.tag, idInfo.value);
  var payload = tlv('00', '01') + tlv('01', amount ? '12' : '11') + tlv('29', merchantInfo) + tlv('53', '764');
  if (amount) payload += tlv('54', parseFloat(amount).toFixed(2));
  payload += tlv('58', 'TH') + '6304';
  return payload + crc16_(payload);
}

function submitOrder(){
  var errBox = document.getElementById('checkoutErrBox');
  errBox.classList.add('sh');

  var items = Object.keys(cart).map(function(name){
    return { name: name, qty: cart[name] }; // ไม่ต้องส่งราคามา เซิร์ฟเวอร์ดึงราคาจริงเองเสมอ
  });
  if (!items.length) { showInlineCheckoutError_('ไม่มีสินค้าในตะกร้า'); return; }

  var shippingAddress = getShippingAddressValue();
  if (!shippingAddress) { showInlineCheckoutError_('กรุณากรอกที่อยู่จัดส่ง'); return; }
  var province = getProvinceValue();
  if (!province) { showInlineCheckoutError_('กรุณาเลือกจังหวัด'); return; }

  var btn = document.getElementById('confirmOrderBtn');
  btn.disabled = true; btn.textContent = '⏳ กำลังบันทึกคำสั่งซื้อ...';

  // เข้ารหัสรายการสินค้าเป็น Base64 ก่อนส่ง (แทนการส่งข้อความไทยตรงๆ ผ่าน URL) เพราะภาษาไทยกิน URL
  // เยอะมากตอนเข้ารหัส (%XX%XX%XX ต่อ 1 ตัวอักษร) ทำให้ URL รวมยาวเกินไปจน idToken เสี่ยงเพี้ยน/ถูกตัดกลางทาง
  var itemsJsonRaw = JSON.stringify(items);
  var itemsB64 = btoa(unescape(encodeURIComponent(itemsJsonRaw))); // UTF-8 safe base64 encode

  getFreshIdToken().then(function(idToken){
    return callApi('createShopOrder', { idToken: idToken, itemsB64: itemsB64, paymentMethod: selectedPayment, couponCode: appliedCouponCode, shippingAddress: shippingAddress, province: province, excludePrivilegeName: excludedPrivilegeRowIndexes.join('|') });
  })
    .then(function(r){
      btn.disabled = false; btn.textContent = '✅ ยืนยันสั่งซื้อ';
      if (!r || !r.success) {
        // แนบข้อมูลวินิจฉัย idToken ไปกับ error เสมอ (ความยาว + จำนวนจุดคั่น — JWT ที่ถูกต้องต้องมี
        // 3 ส่วนคั่นด้วยจุด 2 จุดพอดี ถ้าจำนวนจุดไม่ใช่ 2 แปลว่า token เพี้ยน/ถูกตัดขาดระหว่างทางแน่นอน)
        var dotCount = currentIdToken ? (currentIdToken.match(/\./g) || []).length : 0;
        var tokenInfo = 'idToken ยาว ' + (currentIdToken ? currentIdToken.length : 0) + ' ตัวอักษร, มี ' + dotCount + ' จุด (ต้องมี 2 จุดพอดีถึงจะถูกต้อง)';
        showInlineCheckoutError_('สั่งซื้อไม่สำเร็จ: ' + (r ? r.error : '') + ' (' + tokenInfo + ')');
        return;
      }

      var summaryHtml =
        '<div class="row"><span>เลขที่ออเดอร์</span><span><b>' + escHtml(r.orderId) + '</b></span></div>'
        + '<div class="row"><span>ยอดสินค้า</span><span>฿' + r.subtotal.toLocaleString('th-TH') + '</span></div>';
      if (r.discount > 0) {
        summaryHtml += '<div class="row"><span>ส่วนลดรวม</span><span>-฿' + Math.round(r.discount).toLocaleString('th-TH') + '</span></div>';
      }
      summaryHtml += '<div class="row"><span>🚚 ค่าจัดส่ง</span><span>฿' + Math.round(r.shippingCost || 0).toLocaleString('th-TH') + '</span></div>';
      summaryHtml += '<div class="row" style="border-top:1px dashed var(--gb);margin-top:6px;padding-top:8px"><span><b>ยอดชำระ</b></span><span><b>฿' + r.totalAmount.toLocaleString('th-TH') + '</b></span></div>'
        + '<div class="row"><span>วิธีชำระ</span><span>' + (selectedPayment === 'promptpay' ? 'พร้อมเพย์' : 'โอนธนาคาร') + '</span></div>';
      document.getElementById('orderSummary').innerHTML = summaryHtml;

      // เก็บ URL หน้าแนบสลิปไว้เรียกผ่าน window.open() ตอนกดปุ่ม (แทนการตั้ง href ของ <a> ตรงๆ)
      // เพราะเปิดผ่าน window.open() แล้วหน้าใหม่จะปิดตัวเองด้วย window.close() ได้จริง ต่างจากเปิดผ่าน
      // การคลิกลิงก์ธรรมดาที่เบราว์เซอร์ส่วนใหญ่จะไม่ยอมให้สคริปต์สั่งปิดแท็บที่ตัวเองไม่ได้เปิดเอง
      pendingSlipUploadUrl = API_URL + '?page=uploadSlip&orderId=' + encodeURIComponent(r.orderId);

      cart = {};
      appliedCouponCode = '';
      lastDiscountInfo = null;
      excludedPrivilegeRowIndexes = [];
      savedAddressLoaded = false; // สั่งซื้อสำเร็จแล้ว ที่อยู่อาจเพิ่งอัปเดตใหม่ — รอบหน้าให้โหลดใหม่อีกครั้ง
      showState('orderDoneState');
    })
    .catch(function(e){
      btn.disabled = false; btn.textContent = '✅ ยืนยันสั่งซื้อ';
      if (e && e.alreadyShown) return; // ข้อความที่มีประโยชน์กว่าแสดงไปแล้ว ไม่ต้องทับ
      showInlineCheckoutError_('เรียก API ไม่สำเร็จ: ' + e.message);
    });
}

// แสดง error แบบฝังอยู่ในหน้าชำระเงินเลย (ไม่เด้งไปหน้า error เต็มจอ) — สำคัญมาก เพราะ error ที่พบบ่อย
// ที่สุดคือ "ลืมกรอกที่อยู่" ซึ่งเป็นเรื่องแก้ไขง่ายๆ แค่กรอกเพิ่ม ไม่ควรทำให้ลูกค้าหลุดออกจากหน้าชำระเงิน
// (ตะกร้า/ส่วนลด/ที่อยู่ที่กรอกไว้แล้วจะไม่หายไปไหน) ต่างจาก error ระบบจริงๆ ที่ยังใช้ showErrorState ปกติ
function showInlineCheckoutError_(msg){
  var errBox = document.getElementById('checkoutErrBox');
  errBox.textContent = '⚠️ ' + msg;
  errBox.classList.remove('sh');
  errBox.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

// ==================== LIFF session (login + token) ====================
// ตัดพารามิเตอร์ที่ LINE แปะกลับมาหลัง redirect (code, state ฯลฯ) ออกจาก URL ก่อนใช้เป็น redirectUri
// กัน URL พอกพูนซ้อนกันเรื่อยๆ จนกลายเป็นสาเหตุของการวนซ้ำเวลาต้อง login ใหม่หลายรอบ
function cleanLiffRedirectUri(){
  var url = new URL(location.href);
  ['code', 'state', 'liff.state', 'friendship_status_changed'].forEach(function(key){
    url.searchParams.delete(key);
  });
  url.hash = '';
  return url.toString();
}

// สั่งให้ LINE ล็อกอินใหม่ (วิธีเดียวที่ได้ idToken ใหม่จริงๆ — liff.init() ซ้ำไม่ได้ไปขอ token ใหม่
// จาก LINE เลย แค่คืนค่าเดิมที่แคชไว้) ป้องกันการวนซ้ำไม่รู้จบด้วย sessionStorage: ลอง login ใหม่
// ได้แค่ 1 ครั้งต่อรอบ ถ้ายังไม่สำเร็จอีก (พบบ่อยบนคอมพิวเตอร์ที่บล็อก third-party cookies) จะหยุด
// วนแล้วบอกสาเหตุตรงๆ แทน — คืนค่า false ถ้าแสดงข้อความ error ไปแล้ว (กันไม่ให้ที่อื่นมาทับข้อความนี้)
function startLineLogin(){
  if (sessionStorage.getItem(LIFF_LOGIN_GUARD)) {
    showErrorState('เข้าสู่ระบบ LINE ไม่สำเร็จซ้ำ\n\nสาเหตุที่พบบ่อยที่สุด: เบราว์เซอร์บนคอมพิวเตอร์บล็อกคุกกี้บุคคลที่สาม (third-party cookies) ทำให้ LINE จำสถานะล็อกอินไม่ได้\n\nวิธีแก้ชั่วคราว: อนุญาต third-party cookies สำหรับ line.me ในตั้งค่าเบราว์เซอร์ หรือแนะนำให้สั่งซื้อผ่านแอป LINE บนมือถือแทนครับ (เสถียรกว่ามาก)');
    return false;
  }
  sessionStorage.setItem(LIFF_LOGIN_GUARD, '1');
  liff.login({ redirectUri: cleanLiffRedirectUri() });
  return true; // กำลังจะ redirect ออกจากหน้านี้ ยังไม่ได้แสดง error อะไร
}

// รวบรวมสถานะทั้งหมดที่เกี่ยวข้องกับ LIFF/token ณ ขณะนั้น มาแสดงบนหน้าจอตรงๆ เวลาเกิดปัญหา
// เพื่อให้วินิจฉัยได้จากการแคปหน้าจอ ไม่ต้องเปิด DevTools ให้ยุ่งยาก
function buildDiagnostics_(){
  var lines = [];
  try {
    lines.push('LIFF version: ' + (typeof liff !== 'undefined' && liff.getVersion ? liff.getVersion() : 'ไม่ทราบ'));
    lines.push('เปิดในแอป LINE: ' + (typeof liff !== 'undefined' && liff.isInClient ? (liff.isInClient() ? 'ใช่' : 'ไม่ใช่ (เบราว์เซอร์ภายนอก)') : 'ไม่ทราบ'));
    lines.push('สถานะ login: ' + (typeof liff !== 'undefined' && liff.isLoggedIn ? (liff.isLoggedIn() ? 'เข้าสู่ระบบแล้ว' : 'ยังไม่เข้าสู่ระบบ') : 'ไม่ทราบ'));
  } catch (e) {
    lines.push('อ่านสถานะ LIFF ไม่ได้: ' + e.message);
  }

  var cached = currentIdToken;
  var live = '';
  try { live = (typeof liff !== 'undefined' && liff.getIDToken) ? (liff.getIDToken() || '') : ''; } catch (e) { live = ''; }

  lines.push('token ที่เก็บไว้ตอนเปิดหน้า: ' + (cached ? ('มี (' + cached.length + ' ตัวอักษร, ' + ((cached.match(/\./g) || []).length) + ' จุด)') : 'ไม่มี'));
  lines.push('token ที่ดึงสดตอนนี้: ' + (live ? ('มี (' + live.length + ' ตัวอักษร)') : 'ไม่มี'));

  var t = cached || live;
  if (t) {
    var exp = getIdTokenExpiryMs_(t);
    if (!exp) {
      lines.push('วันหมดอายุ: ถอดไม่ได้ (จะส่งให้เซิร์ฟเวอร์ตรวจแทน)');
    } else {
      var mins = Math.round((exp - Date.now()) / 60000);
      lines.push('วันหมดอายุ: ' + new Date(exp).toLocaleString('th-TH') + ' (' + (mins >= 0 ? 'เหลืออีก ' + mins + ' นาที' : 'หมดไปแล้ว ' + Math.abs(mins) + ' นาที') + ')');
    }
  }
  lines.push('เวลาเครื่องนี้: ' + new Date().toLocaleString('th-TH'));
  lines.push('ตัวกันวน login: ' + (sessionStorage.getItem(LIFF_LOGIN_GUARD) ? 'ทำงานอยู่ (เคยลอง login ไปแล้ว 1 รอบ)' : 'ยังไม่ทำงาน'));
  return lines.join('\n');
}

function showErrorWithDiagnostics_(msg){
  showErrorState(msg + '\n\n──────────\nข้อมูลวินิจฉัย (แคปหน้าจอนี้ส่งให้ผู้ดูแลระบบได้)\n' + buildDiagnostics_());
}

// ดึง idToken สำหรับใช้เรียก API ที่ต้องยืนยันตัวตน
// สำคัญมาก (ต้นตอของอาการ "มือถือใช้ได้ แต่คอมใช้ไม่ได้"): ห้ามเรียก liff.init() ซ้ำตรงนี้เด็ดขาด
// เพราะบนเบราว์เซอร์คอมพิวเตอร์ (external browser) LIFF เก็บ token ไว้จากขั้นตอน OAuth redirect ตอนเปิด
// หน้าครั้งแรก การ init ซ้ำจะรีเซ็ตสถานะภายในแล้วทำให้ getIDToken() คืนค่าว่าง ทั้งที่เมื่อกี้ยังมีอยู่ดีๆ
// (บนแอป LINE มือถือ token มาจาก context ของแอปโดยตรง เลยไม่หาย → จึงเจอปัญหาเฉพาะบนคอม)
// วิธีที่ถูกต้อง: ใช้ค่า currentIdToken ที่เก็บไว้ตั้งแต่ initLiff() สำเร็จ (idToken อายุ 1 ชม. นานพอสำหรับ
// การสั่งซื้อ 1 รอบอยู่แล้ว) แล้วเช็ควันหมดอายุจากตัว token นั้นตรงๆ ไม่ต้องไปขอใหม่
function getFreshIdToken(){
  var token = currentIdToken || liff.getIDToken();

  if (!token) {
    var redirecting = startLineLogin();
    // หมายเหตุ: ถ้า redirecting เป็น false แปลว่า startLineLogin() เจอตัวกันวน (เคยลองแล้ว 1 รอบ) ซึ่งมันจะ
    // แสดงข้อความที่ชัดเจนกว่านี้ให้อยู่แล้ว (อธิบายเรื่อง third-party cookies + แนะนำให้ใช้แอป LINE แทน)
    // ห้ามเรียก showErrorWithDiagnostics_() ทับตรงนี้อีก เพราะจะไปเขียนทับข้อความที่ดีกว่านั้นทิ้ง
    // กลายเป็นข้อความทั่วไปที่ไม่มีคำแนะนำอะไรให้ลูกค้าทำต่อได้เลย (นี่คือบั๊กที่เคยเกิดขึ้นจริง)
    var errNoToken = new Error('ไม่พบ ID token กรุณาเข้าสู่ระบบ LINE ใหม่');
    errNoToken.alreadyShown = !redirecting;
    return Promise.reject(errNoToken);
  }

  // เช็ควันหมดอายุแบบ "ปลอดภัยไว้ก่อน": ถ้าถอด exp ไม่ได้ (expiryMs = 0) ให้เชื่อ token ไว้ก่อนแล้วส่งไป
  // ให้เซิร์ฟเวอร์ตรวจสอบเอง ดีกว่าเดาเองว่าหมดอายุแล้วเด้งไป login ทิ้งตะกร้าสินค้าโดยไม่จำเป็น
  // (เซิร์ฟเวอร์มีระบบวินิจฉัยละเอียดอยู่แล้ว ถ้า token เสียจริงจะได้ข้อความบอกสาเหตุตรงๆ กลับมา)
  var expiryMs = getIdTokenExpiryMs_(token);
  if (expiryMs && Date.now() >= expiryMs - 30000) {
    var redirectingExpired = startLineLogin(); // เหตุผลเดียวกับด้านบน — ไม่เรียก showErrorWithDiagnostics_() ซ้ำ
    var errExpired = new Error('LINE session หมดอายุ (โทเคนมีอายุ 1 ชั่วโมง)');
    errExpired.alreadyShown = !redirectingExpired;
    return Promise.reject(errExpired);
  }

  currentIdToken = token;
  return Promise.resolve(token);
}

function initLiff(){
  var initTimeout = setTimeout(function(){
    showErrorState('liff.init() ใช้เวลานานเกิน 10 วินาที — กรุณาตรวจ LIFF ID และ Endpoint URL');
  }, 10000);

  liff.init({ liffId: LIFF_ID }).then(function(){
    clearTimeout(initTimeout);
    if (!liff.isLoggedIn()) {
      startLineLogin();
      return;
    }
    sessionStorage.removeItem(LIFF_LOGIN_GUARD); // login สำเร็จแล้วจริง เคลียร์ตัวกันซ้ำทิ้ง เผื่อรอบถัดไปหมดอายุอีกจะ retry ได้ใหม่
    currentIdToken = liff.getIDToken();
    if (!currentIdToken) {
      showErrorState('LINE Login สำเร็จ แต่ LIFF ไม่ส่ง ID token กลับมา');
      return;
    }
    loadProducts();
  }).catch(function(e){
    clearTimeout(initTimeout);
    showErrorState('liff.init() ล้มเหลว: ' + (e && e.message ? e.message : String(e)));
  });
}

initLiff();
</script>
