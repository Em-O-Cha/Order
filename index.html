<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>สั่งซื้อสินค้า</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap');
:root{
  --gd:#1a5c2a; --gm:#2e7d32; --gp:#e8f5e9; --gb:#c8e6c9;
  --g6:#757575; --g8:#424242; --td:#1b2e1c;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Sarabun',sans-serif;background:#f5f5f5;color:var(--td);min-height:100vh;padding:16px;}
.card{background:#fff;border-radius:20px;box-shadow:0 4px 20px rgba(0,0,0,.08);max-width:420px;width:100%;
  margin:0 auto;overflow:hidden;}
.hd{background:linear-gradient(135deg,var(--gd),#66bb6a);padding:24px;text-align:center;color:#fff;}
.brand-logo{width:56px;height:70px;object-fit:contain;margin:0 auto 8px;display:block;}
.hd h1{font-size:19px;font-weight:600;}
.hd p{font-size:13px;opacity:.9;margin-top:4px;}
.bd{padding:20px;}
.state{text-align:center;padding:20px 0;}
.state .ico{font-size:40px;margin-bottom:12px;}
#errorMsg{white-space:pre-line;text-align:left;font-size:13px;line-height:1.6;background:#fff3e0;border-radius:8px;padding:12px;}
.sh{display:none;}

.prod-item{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid #eee;}
.prod-item:last-child{border-bottom:none;}
.prod-name{flex:1;font-size:14px;}
.prod-price{font-size:13px;color:var(--g6);margin-top:2px;}
.qty-ctl{display:flex;align-items:center;gap:8px;}
.qty-btn{width:30px;height:30px;border-radius:8px;border:1.5px solid var(--gb);background:var(--gp);
  color:var(--gd);font-size:16px;font-weight:700;cursor:pointer;}
.qty-val{width:24px;text-align:center;font-weight:600;}

.cart-bar{position:sticky;bottom:0;background:#fff;border-top:1.5px solid #eee;padding:14px 20px;
  display:flex;justify-content:space-between;align-items:center;}
.cart-total{font-size:13px;color:var(--g6);}
.cart-total b{font-size:17px;color:var(--gd);display:block;}
.btn{padding:12px 24px;border:none;border-radius:10px;background:var(--gm);color:#fff;
  font-size:14px;font-weight:600;font-family:'Sarabun',sans-serif;cursor:pointer;}
.btn:disabled{opacity:.5;}
.btn-block{width:100%;height:48px;}
.btn-outline{background:#fff;color:var(--gm);border:1.5px solid var(--gm);}

.pay-opt{border:1.5px solid #eee;border-radius:12px;padding:14px;margin-bottom:10px;cursor:pointer;}
.pay-opt.active{border-color:var(--gm);background:var(--gp);}
.pay-opt input{margin-right:8px;}

.qr-box{text-align:center;padding:16px;background:var(--gp);border-radius:12px;margin-top:14px;}
.qr-box canvas,.qr-box img{margin:0 auto;}
.bank-box{background:var(--gp);border-radius:12px;padding:16px;margin-top:14px;font-size:14px;}
.bank-box .row{display:flex;justify-content:space-between;padding:5px 0;}
.bank-box .row span:first-child{color:var(--g6);}
.bank-box .row span:last-child{font-weight:600;color:var(--gd);}

.order-box{background:var(--gp);border-radius:12px;padding:18px;text-align:left;margin-top:10px;}
.order-box .row{display:flex;justify-content:space-between;font-size:14px;padding:5px 0;}
</style>
</head>

// ⚠️ ใส่ Apps Script Web App URL ตรงนี้ (URL เดียวกับที่ใช้ในหน้าสมัครสมาชิก ลงท้าย /exec)
var API_URL = 'https://script.google.com/macros/s/AKfycbw0P4L2ztNKcb7Gj_ehituROwU11UsB-mdHNlPkqmbG_1UB_UYqtFkvVV-kgCBL5juSUg/exec';

var currentIdToken = null;
var products = [];
var cart = {}; // { productName: qty }
var paymentInfo = null;
var selectedPayment = 'promptpay';
var appliedCouponCode = '';
var lastDiscountInfo = null; // { privilege, coupon, couponError } จาก checkShopDiscounts ล่าสุด

function showState(id){
  ['loadingState','catalogState','checkoutState','orderDoneState','errorState'].forEach(function(s){
    document.getElementById(s).classList.toggle('sh', s !== id);
  });
  document.getElementById('cartBar').classList.toggle('sh', id !== 'catalogState');
}
function showErrorState(msg){
  document.getElementById('errorState').innerHTML = '<div class="ico">⚠️</div><div id="errorMsg">' + msg.replace(/</g,'&lt;') + '</div>';
  showState('errorState');
}

// เรียก Apps Script ผ่าน fetch() แบบ GET เสมอ (แม้แต่ action ที่เปลี่ยนแปลงข้อมูล) เพราะ POST ข้าม
// domain เจอปัญหา CORS จากการ redirect ของ Apps Script ในเบราว์เซอร์ของแอป LINE มาก่อนแล้ว
function callApi(action, payload){
  payload = payload || {};
  payload.action = action;
  var qs = Object.keys(payload).map(function(k){
    return encodeURIComponent(k) + '=' + encodeURIComponent(payload[k]);
  }).join('&');
  return fetch(API_URL + '?' + qs, { method: 'GET' }).then(function(res){ return res.json(); });
}

function initLiff(){
  var initTimeout = setTimeout(function(){
    showErrorState('liff.init() ค้างเกิน 10 วินาที\nLIFF_ID: "' + LIFF_ID + '"');
  }, 10000);

  liff.init({ liffId: LIFF_ID }).then(function(){
    clearTimeout(initTimeout);
    if (!liff.isLoggedIn()) { liff.login(); return; }
    currentIdToken = liff.getIDToken();
    if (!currentIdToken) { showErrorState('liff.getIDToken() คืนค่าว่างเปล่า'); return; }
    loadProducts();
  }).catch(function(e){
    clearTimeout(initTimeout);
    showErrorState('liff.init() ล้มเหลว: ' + (e && e.message ? e.message : JSON.stringify(e)));
  });
}

function loadProducts(){
  callApi('getShopProducts')
    .then(function(r){
      if (!r || !r.success) { showErrorState('โหลดสินค้าไม่สำเร็จ: ' + (r ? r.error : '')); return; }
      products = r.products || [];
      renderCatalog();
      showState('catalogState');
    })
    .catch(function(e){ showErrorState('เรียก API ไม่สำเร็จ: ' + e.message); });
}

function renderCatalog(){
  var h = '';
  products.forEach(function(p, idx){
    h += '<div class="prod-item">'
      + '<div style="flex:1"><div class="prod-name">' + escHtml(p.name) + '</div><div class="prod-price">฿' + p.price.toLocaleString('th-TH') + '</div></div>'
      + '<div class="qty-ctl">'
      + '<button class="qty-btn" onclick="changeQty(' + idx + ',-1)">−</button>'
      + '<span class="qty-val" id="qty_' + idx + '">0</span>'
      + '<button class="qty-btn" onclick="changeQty(' + idx + ',1)">+</button>'
      + '</div></div>';
  });
  document.getElementById('prodList').innerHTML = h || '<p style="color:var(--g6);text-align:center">ยังไม่มีสินค้า</p>';
}

function escHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function changeQty(idx, delta){
  var name = products[idx].name;
  var cur = cart[name] || 0;
  cur = Math.max(0, cur + delta);
  if (cur === 0) delete cart[name]; else cart[name] = cur;
  document.getElementById('qty_' + idx).textContent = cur;
  updateCartBar();
}

function updateCartBar(){
  var count = 0, total = 0;
  Object.keys(cart).forEach(function(name){
    var p = products.find(function(x){ return x.name === name; });
    if (!p) return;
    count += cart[name];
    total += cart[name] * p.price;
  });
  document.getElementById('cartCount').textContent = count;
  document.getElementById('cartTotal').textContent = '฿' + total.toLocaleString('th-TH');
  document.getElementById('checkoutBtn').disabled = count === 0;
}

function backToCatalog(){ showState('catalogState'); }

function goToCheckout(){
  callApi('getShopPaymentInfo')
    .then(function(r){
      if (r && r.success) paymentInfo = r;
      return refreshDiscounts();
    })
    .then(function(){
      showState('checkoutState');
    })
    .catch(function(){ showErrorState('โหลดข้อมูลการชำระเงินไม่สำเร็จ'); });
}

// เช็คส่วนลด (สิทธิ์ส่วนบุคคล + คูปองถ้ามีการกรอก) — เรียกตอนเข้าหน้าเช็คเอาท์ครั้งแรก (เช็คสิทธิ์
// อัตโนมัติ) และตอนกดปุ่ม "ใช้โค้ด" (เช็คคูปองเพิ่ม) จำนวนที่แสดงเป็นแค่ตัวช่วยพรีวิว ของจริงคำนวณ
// ใหม่อีกครั้งฝั่งเซิร์ฟเวอร์ตอนกดยืนยันสั่งซื้อเสมอ
function refreshDiscounts(){
  var subtotal = getCartTotal();
  return callApi('checkShopDiscounts', { idToken: currentIdToken, couponCode: appliedCouponCode, subtotal: subtotal })
    .then(function(r){
      if (r && r.success) lastDiscountInfo = r;
      renderDiscountSummary();
      renderPaymentDetail();
    });
}

function applyCoupon(){
  var code = document.getElementById('couponInput').value.trim();
  if (!code) return;
  appliedCouponCode = code;
  refreshDiscounts();
}

function getDiscountAmount(){
  if (!lastDiscountInfo) return 0;
  var d = 0;
  if (lastDiscountInfo.privilege) d += lastDiscountInfo.privilege.discount;
  if (lastDiscountInfo.coupon) d += lastDiscountInfo.coupon.discount;
  return Math.min(getCartTotal(), d);
}

function renderDiscountSummary(){
  var wrap = document.getElementById('discountSummary');
  var subtotal = getCartTotal();
  var h = '<div class="bank-box"><div class="row"><span>ยอดสินค้า</span><span>฿' + subtotal.toLocaleString('th-TH') + '</span></div>';
  if (lastDiscountInfo && lastDiscountInfo.privilege) {
    h += '<div class="row"><span>🎁 ' + escHtml(lastDiscountInfo.privilege.name) + '</span><span>-฿' + Math.round(lastDiscountInfo.privilege.discount).toLocaleString('th-TH') + '</span></div>';
  }
  if (lastDiscountInfo && lastDiscountInfo.coupon) {
    h += '<div class="row"><span>🏷️ โค้ด ' + escHtml(lastDiscountInfo.coupon.code) + '</span><span>-฿' + Math.round(lastDiscountInfo.coupon.discount).toLocaleString('th-TH') + '</span></div>';
  }
  if (lastDiscountInfo && lastDiscountInfo.couponError) {
    h += '<div class="row" style="color:#c62828"><span colspan="2">⚠️ ' + escHtml(lastDiscountInfo.couponError) + '</span></div>';
  }
  h += '<div class="row" style="border-top:1px dashed var(--gb);margin-top:6px;padding-top:8px"><span><b>ยอดสุทธิ</b></span><span><b>฿' + getFinalTotal().toLocaleString('th-TH') + '</b></span></div>';
  h += '</div>';
  wrap.innerHTML = h;
}

function selectPayment(method){
  selectedPayment = method;
  document.getElementById('optPromptpay').classList.toggle('active', method === 'promptpay');
  document.getElementById('optBank').classList.toggle('active', method === 'bank');
  renderPaymentDetail();
}

function getCartTotal(){
  var total = 0;
  Object.keys(cart).forEach(function(name){
    var p = products.find(function(x){ return x.name === name; });
    if (p) total += cart[name] * p.price;
  });
  return total;
}

function getFinalTotal(){
  return Math.max(0, getCartTotal() - getDiscountAmount());
}

function renderPaymentDetail(){
  var wrap = document.getElementById('paymentDetail');
  var total = getFinalTotal();
  if (!paymentInfo) { wrap.innerHTML = ''; return; }
  if (selectedPayment === 'promptpay') {
    wrap.innerHTML = '<div class="qr-box"><div id="qrCanvas"></div><p style="margin-top:10px;font-size:13px;color:var(--g6)">ยอดชำระ ฿' + total.toLocaleString('th-TH') + '</p></div>';
    var payload = buildPromptPayPayload(paymentInfo.promptPayId, total);
    document.getElementById('qrCanvas').innerHTML = '';
    new QRCode(document.getElementById('qrCanvas'), { text: payload, width: 200, height: 200 });
  } else {
    wrap.innerHTML = '<div class="bank-box">'
      + '<div class="row"><span>ธนาคาร</span><span>' + escHtml(paymentInfo.bankName) + '</span></div>'
      + '<div class="row"><span>เลขบัญชี</span><span>' + escHtml(paymentInfo.bankAccount) + '</span></div>'
      + '<div class="row"><span>ชื่อบัญชี</span><span>' + escHtml(paymentInfo.accountName) + '</span></div>'
      + '<div class="row"><span>ยอดโอน</span><span>฿' + total.toLocaleString('th-TH') + '</span></div>'
      + '</div>';
  }
}

// ==================== PromptPay QR (EMV QR Code) ====================
// สร้าง payload สำหรับ QR พร้อมเพย์เอง ตามมาตรฐาน EMV QRCPS Merchant Presented Mode ที่พร้อมเพย์ใช้จริง
// ไม่พึ่งบริการภายนอกใดๆ ทั้งสิ้น (ทำงานฝั่ง client ล้วนๆ ปลอดภัย ไม่มีความเสี่ยงบริการภายนอกล่ม/ปิดตัว)
function tlv(id, value){
  var length = String(value.length).padStart(2, '0');
  return id + length + value;
}
function formatPromptPayId_(id){
  id = String(id).replace(/[^0-9]/g, '');
  if (id.length === 13) {
    // เลขนิติบุคคล/บัตรประชาชน
    return { tag: '02', value: id };
  }
  if (id.length === 10 && id.charAt(0) === '0') {
    // เบอร์โทรศัพท์ -> แปลงเป็นรูปแบบสากล 0066XXXXXXXXX ตามสเปคพร้อมเพย์
    id = '66' + id.substring(1);
  }
  return { tag: '01', value: '00' + id };
}
function crc16_(data){
  var crc = 0xFFFF;
  for (var i = 0; i < data.length; i++) {
    crc ^= (data.charCodeAt(i) << 8);
    for (var j = 0; j < 8; j++) {
      if (crc & 0x8000) crc = ((crc << 1) ^ 0x1021) & 0xFFFF;
      else crc = (crc << 1) & 0xFFFF;
    }
  }
  return crc.toString(16).toUpperCase().padStart(4, '0');
}
function buildPromptPayPayload(promptPayId, amount){
  var idInfo = formatPromptPayId_(promptPayId);
  var merchantInfo = tlv('00', 'A000000677010111') + tlv(idInfo.tag, idInfo.value);
  var payload = tlv('00', '01') + tlv('01', amount ? '12' : '11') + tlv('29', merchantInfo) + tlv('53', '764');
  if (amount) payload += tlv('54', parseFloat(amount).toFixed(2));
  payload += tlv('58', 'TH') + '6304';
  return payload + crc16_(payload);
}

function submitOrder(){
  var items = Object.keys(cart).map(function(name){
    return { name: name, qty: cart[name] }; // ไม่ต้องส่งราคามา เซิร์ฟเวอร์ดึงราคาจริงเองเสมอ
  });
  if (!items.length) { showErrorState('ไม่มีสินค้าในตะกร้า'); return; }

  var btn = document.getElementById('confirmOrderBtn');
  btn.disabled = true; btn.textContent = '⏳ กำลังบันทึกคำสั่งซื้อ...';

  callApi('createShopOrder', { idToken: currentIdToken, itemsJson: JSON.stringify(items), paymentMethod: selectedPayment, couponCode: appliedCouponCode })
    .then(function(r){
      btn.disabled = false; btn.textContent = '✅ ยืนยันสั่งซื้อ';
      if (!r || !r.success) { showErrorState('สั่งซื้อไม่สำเร็จ: ' + (r ? r.error : '')); return; }

      var summaryHtml =
        '<div class="row"><span>เลขที่ออเดอร์</span><span><b>' + escHtml(r.orderId) + '</b></span></div>'
        + '<div class="row"><span>ยอดสินค้า</span><span>฿' + r.subtotal.toLocaleString('th-TH') + '</span></div>';
      if (r.discount > 0) {
        summaryHtml += '<div class="row"><span>ส่วนลดรวม</span><span>-฿' + Math.round(r.discount).toLocaleString('th-TH') + '</span></div>';
      }
      summaryHtml += '<div class="row" style="border-top:1px dashed var(--gb);margin-top:6px;padding-top:8px"><span><b>ยอดชำระ</b></span><span><b>฿' + r.totalAmount.toLocaleString('th-TH') + '</b></span></div>'
        + '<div class="row"><span>วิธีชำระ</span><span>' + (selectedPayment === 'promptpay' ? 'พร้อมเพย์' : 'โอนธนาคาร') + '</span></div>';
      document.getElementById('orderSummary').innerHTML = summaryHtml;

      // เปิดหน้าแนบสลิป (เสิร์ฟโดย Apps Script โดยตรง ไม่ใช่หน้า LIFF) พร้อมเลขที่ออเดอร์
      var uploadUrl = API_URL + '?page=uploadSlip&orderId=' + encodeURIComponent(r.orderId);
      document.getElementById('uploadSlipLink').href = uploadUrl;

      cart = {};
      appliedCouponCode = '';
      lastDiscountInfo = null;
      showState('orderDoneState');
    })
    .catch(function(e){
      btn.disabled = false; btn.textContent = '✅ ยืนยันสั่งซื้อ';
      showErrorState('เรียก API ไม่สำเร็จ: ' + e.message);
    });
}

initLiff();
</script>
