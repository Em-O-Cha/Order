<!-- ==================== แท็บ "ใบเสร็จ 7-Eleven" และ "ใบจัดส่งพรีเมียม" ในหน้าแอดมิน ====================
     ไฟล์ HTML ในโปรเจกต์ Apps Script "Members LINE" (ชื่อไฟล์ LoyaltyAdmin) — SupabaseLoyalty.gs แทรกไฟล์นี้ท้าย
     หน้าแอดมิน (doGet page=admin) เอง ไม่ต้องแก้ admin.html
     - เพิ่มปุ่มแท็บ 2 ปุ่มต่อท้ายแถวแท็บเดิม และห่อ switchTab() ให้สลับแท็บใหม่ได้เหมือนแท็บเดิม
     - ข้อมูลมาจาก Edge Function "loyalty" ใน Supabase (ลิงก์/โทเคนขอจาก loyaltyAdminLinks(adminPin) หลังกรอก PIN)
     - ตรวจ/อนุมัติใบเสร็จ, ตั้งค่า, พิมพ์ใบจัดส่ง, บันทึกเลขพัสดุ อยู่ในหน้านี้ทั้งหมด -->
<style>
.ly-hd{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.ly-hd b{flex:1;font-size:14px;}
.ly-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
.ly-bar .fc{flex:1;min-width:130px;height:40px;}
.ly-bar .btn{height:40px;padding:0 14px;}
.ly-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px;}
.ly-stats div{background:var(--gp);border-radius:10px;padding:8px 4px;text-align:center;font-size:11px;color:var(--gd);}
.ly-stats b{display:block;font-size:16px;}
.ly-st{font-size:10px;font-weight:600;padding:2px 8px;border-radius:20px;white-space:nowrap;}
.ly-st.pending_review,.ly-st.pending{background:#fff3bf;color:#8a6d00;}
.ly-st.approved,.ly-st.shipped{background:#d3f9d8;color:#2b8a3e;}
.ly-st.rejected,.ly-st.cancelled{background:#ffe3e3;color:#c92a2a;}
.ly-st.printed{background:#e7f5ff;color:#1864ab;}
.ly-dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:#9aa5b1;}
.ly-dot.pass{background:#20c997;} .ly-dot.suspect{background:#fd7e14;} .ly-dot.fail{background:#e03131;}
.ly-verdict{border-radius:10px;padding:10px 12px;color:#fff;margin-bottom:10px;font-size:13px;font-weight:600;background:linear-gradient(135deg,#536976,#292e49);}
.ly-verdict.pass{background:linear-gradient(135deg,#11998e,#38ef7d);}
.ly-verdict.suspect{background:linear-gradient(135deg,#f7971e,#f2542d);}
.ly-verdict.fail{background:linear-gradient(135deg,#cb2d3e,#ef473a);}
.ly-img{background:#eceff1;border-radius:10px;text-align:center;margin-bottom:10px;overflow:hidden;}
.ly-img img{max-width:100%;max-height:60vh;display:block;margin:0 auto;cursor:zoom-in;}
.ly-img a{display:inline-block;padding:10px;font-size:13px;color:var(--gm);font-weight:600;}
.ly-flags{background:#fff4e5;border-radius:10px;padding:8px 10px 8px 26px;margin:8px 0;font-size:12px;color:#b54708;line-height:1.6;}
.ly-note{background:#f7f7f8;border-radius:10px;padding:8px 10px;font-size:12px;color:var(--g8);margin:8px 0;}
.ly-sec{font-size:13px;font-weight:700;color:var(--g8);margin:14px 0 6px;}
.ly-pts{display:flex;gap:8px;align-items:center;}
.ly-pts .fc{text-align:center;font-size:18px;font-weight:700;}
.ly-pts .btn{width:44px;height:44px;padding:0;font-size:18px;}
.ly-reasons{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;}
.ly-reasons button{font-family:inherit;font-size:12px;padding:4px 10px;border-radius:20px;border:1px solid #ddd;background:#fafafa;cursor:pointer;}
.ly-two{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.ly-sw{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #f3f3f3;font-size:13px;}
.ly-sw small{display:block;color:var(--g6);font-size:11px;}
.ly-sw input{width:20px;height:20px;flex-shrink:0;}
.ly-q{border:1.5px solid #eee;border-radius:10px;padding:10px;margin-bottom:8px;}
.ly-q-hd{display:flex;gap:6px;align-items:center;margin-bottom:6px;font-size:12px;color:var(--g6);}
.ly-q-hd span{flex:1;}
.ly-bars{font-size:12px;margin-bottom:10px;}
.ly-bars .r{display:flex;align-items:center;gap:6px;margin-top:3px;}
.ly-bars .l{width:45%;flex-shrink:0;}
.ly-bars .t{flex:1;background:#f1f3f5;border-radius:20px;height:10px;overflow:hidden;}
.ly-bars .t i{display:block;height:100%;background:var(--gm);border-radius:20px;}
.ly-ship-form{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px;}
.ly-ship-form .full{grid-column:1/-1;}
.ly-ship-form .fc{height:38px;}
.ly-zoom{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:400;overflow:auto;}
.ly-zoom img{width:100%;}
/* ใบจัดส่ง (ใช้ตอนพิมพ์) */
#lyPrintArea{display:none;}
.ly-label{width:100mm;min-height:148mm;padding:5mm;color:#000;background:#fff;font-family:'Sarabun',sans-serif;
  display:flex;flex-direction:column;gap:3mm;font-size:11pt;line-height:1.35;page-break-after:always;break-after:page;}
.ly-label .top{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #000;padding-bottom:2mm;}
.ly-label .top b{font-size:15pt;}
.ly-label .box{border:1.5px solid #000;border-radius:2mm;padding:3mm;}
.ly-label .cap{font-size:9pt;font-weight:700;}
.ly-label .name{font-size:17pt;font-weight:700;}
.ly-label .phone{font-size:14pt;font-weight:700;}
.ly-label .addr{font-size:13pt;}
.ly-label .prov{font-size:14pt;font-weight:700;}
.ly-label .foot{font-size:8pt;margin-top:auto;text-align:right;}
@media print{
  body.ly-printing > *:not(#lyPrintArea){display:none !important;}
  body.ly-printing{padding:0;background:#fff;}
  body.ly-printing #lyPrintArea{display:block;}
  @page{size:100mm 150mm;margin:0;}
}
</style>

<div id="lyPrintArea"></div>
<div class="ly-zoom sh" id="lyZoom" onclick="this.classList.add('sh')"><img id="lyZoomImg" alt=""></div>

<script>
(function(){
  var API = 'https://qotlepudmkuniyjvqmle.supabase.co/functions/v1/loyalty?forceFunctionRegion=ap-northeast-2';
  var STATUS = { pending_review: 'รอตรวจ', approved: 'อนุมัติแล้ว', rejected: 'ไม่อนุมัติ',
                 pending: 'รอพิมพ์', printed: 'พิมพ์แล้ว', shipped: 'จัดส่งแล้ว', cancelled: 'ยกเลิก' };
  var VERDICT = { pass: 'AI ตรวจเบื้องต้น: ผ่าน', suspect: 'AI ตรวจเบื้องต้น: น่าสงสัย ตรวจละเอียด',
                  fail: 'AI ตรวจเบื้องต้น: ไม่ผ่าน', unchecked: 'AI ยังไม่ได้ตรวจ (ตรวจเอง)' };
  var REASONS = ['ไม่พบสินค้าเอมโอชาในใบเสร็จ', 'รูปใบเสร็จไม่ชัด อ่านไม่ได้', 'ใบเสร็จนี้เคยใช้สะสมคะแนนแล้ว',
                 'ไม่ใช่ใบเสร็จ 7-Eleven', 'ใบเสร็จเกินระยะเวลาที่กำหนด', 'ใบเสร็จไม่ถูกต้องหรือมีการแก้ไข'];
  var CARRIERS = ['ไปรษณีย์ไทย (EMS)', 'ไปรษณีย์ไทย (ลงทะเบียน)', 'Flash Express', 'Kerry Express', 'J&T Express',
                  'SPX Express', 'Best Express', 'Lalamove / Grab', 'ส่งเอง'];
  var links = null;           // { receipts, shipments, settings } + โทเคน t ของแต่ละหน้า
  var tok = {};
  var receipt = null;         // ใบที่เปิดดูอยู่ (ผลของ action review)
  var decision = 'approve';
  var shipments = [], sender = {};
  var settings = null, survey = [];
  var filter = 'pending';

  function h(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function baht(n){ var x = parseFloat(n); return isNaN(x) ? '-' : x.toLocaleString('th-TH', { maximumFractionDigits: 2 }) + ' บาท'; }
  function dt(s, time){
    if (!s) return '-';
    var d = new Date(s); if (isNaN(d)) return h(s);
    return d.toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: '2-digit' }) +
      (time ? ' ' + d.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }) : '');
  }
  function phone(p){ var d = String(p || '').replace(/\D/g, ''); return d.length === 10 ? d.slice(0,3) + '-' + d.slice(3,6) + '-' + d.slice(6) : (p || '-'); }
  function row(label, value){ return '<div class="row"><span>' + h(label) + '</span><span style="text-align:right;font-weight:600">' + value + '</span></div>'; }
  function alertMsg(m){ if (typeof showCustomAlert_ === 'function') showCustomAlert_(m); else alert(m); }
  function confirmMsg(m, fn){ if (typeof showCustomConfirm_ === 'function') showCustomConfirm_(m, fn); else if (confirm(m)) fn(); }
  function el(id){ return document.getElementById(id); }
  function setHtml(id, html){ var x = el(id); if (x) x.innerHTML = html; }
  function tokenOf(url){ var m = /[?&]t=([0-9a-f]{32})/.exec(url || ''); return m ? m[1] : ''; }

  function api(params){
    return fetch(API, { method: 'POST', body: new URLSearchParams(params).toString() }).then(function(r){ return r.json(); });
  }
  // ขอลิงก์/โทเคนครั้งแรกที่เปิดแท็บ (ตรวจ PIN ที่ Apps Script)
  function ensureLinks(){
    if (links) return Promise.resolve(links);
    return new Promise(function(resolve, reject){
      google.script.run.withSuccessHandler(function(r){
        if (!r || !r.success) { reject(new Error((r && r.error) || 'เปิดไม่สำเร็จ')); return; }
        links = r;
        tok = { rl: tokenOf(r.receipts), sl: tokenOf(r.shipments), cfg: tokenOf(r.settings) };
        resolve(r);
      }).withFailureHandler(function(e){ reject(e); }).loyaltyAdminLinks(window.adminPin || '');
    });
  }
  function fail(id, e){ setHtml(id, '<div class="err show">' + h(e && e.message ? e.message : e) + '</div>'); }

  // ==================== แท็บ + โครงหน้า ====================
  function mount(){
    var tabs = document.querySelector('.tabs');
    var main = el('mainArea');
    if (!tabs || !main || el('tabLoyaltyBtn')) return;
    tabs.insertAdjacentHTML('beforeend',
      '<button type="button" class="tab-btn" id="tabLoyaltyBtn" onclick="switchTab(\'loyalty\')">🧾 ใบเสร็จ 7-Eleven</button>' +
      '<button type="button" class="tab-btn" id="tabPremiumShipBtn" onclick="switchTab(\'premiumShip\')">🏷️ ใบจัดส่งพรีเมียม</button>');
    main.insertAdjacentHTML('beforeend',
      '<div id="tabLoyalty" class="sh">' +
        '<div class="card" id="lyListCard">' +
          '<div class="ly-hd"><b>🧾 ใบเสร็จ 7-Eleven</b><button class="btn btn-outline" style="padding:6px 12px" onclick="LY.toggleSettings()">⚙️ ตั้งค่า</button></div>' +
          '<div class="hint" style="margin-bottom:10px">ลูกค้าส่งใบเสร็จจากหน้าสมาชิก → AI ตรวจเบื้องต้น → กดดูแล้วอนุมัติ ระบบเพิ่มคะแนนและส่ง LINE แจ้งลูกค้าเอง</div>' +
          '<div class="ly-bar"><select class="fc" id="lyFilter" onchange="LY.setFilter(this.value)">' +
            '<option value="pending">รอตรวจ</option><option value="all">ทั้งหมด (7 วันล่าสุด)</option></select>' +
          '<button class="btn" onclick="LY.loadList()">🔄 รีเฟรช</button></div>' +
          '<div id="lyList"><div class="empty">กำลังโหลด...</div></div>' +
        '</div>' +
        '<div class="card sh" id="lyDetailCard"></div>' +
        '<div class="card sh" id="lySettingsCard"></div>' +
      '</div>' +
      '<div id="tabPremiumShip" class="sh">' +
        '<div class="card">' +
          '<div class="ly-hd"><b>🏷️ ใบจัดส่งของพรีเมียม</b></div>' +
          '<div class="hint" style="margin-bottom:10px">ลูกค้าแลกของพรีเมียม → ติ๊กเลือกแล้วพิมพ์ใบจัดส่ง (ฉลาก 100×150 มม.) → ใส่เลขพัสดุแล้วกด "จัดส่งแล้ว" ระบบแจ้งลูกค้าทาง LINE</div>' +
          '<div class="ly-bar"><select class="fc" id="lyShipFilter" onchange="LY.renderShipments()">' +
            '<option value="open">ยังไม่จัดส่ง</option><option value="all">ทั้งหมด (14 วันล่าสุด)</option></select>' +
          '<button class="btn" onclick="LY.printSelected()">🖨️ พิมพ์ที่เลือก</button>' +
          '<button class="btn btn-outline" onclick="LY.loadShipments()">🔄</button></div>' +
          '<div id="lyShipList"><div class="empty">กำลังโหลด...</div></div>' +
        '</div>' +
      '</div>');
    var orig = window.switchTab;
    window.switchTab = function(tab){
      var mine = tab === 'loyalty' || tab === 'premiumShip';
      if (typeof orig === 'function') orig.call(this, mine ? '__none__' : tab);
      el('tabLoyalty').classList.toggle('sh', tab !== 'loyalty');
      el('tabPremiumShip').classList.toggle('sh', tab !== 'premiumShip');
      el('tabLoyaltyBtn').classList.toggle('active', tab === 'loyalty');
      el('tabPremiumShipBtn').classList.toggle('active', tab === 'premiumShip');
      if (tab === 'loyalty') loadList();
      if (tab === 'premiumShip') loadShipments();
    };
  }

  // ==================== ใบเสร็จ: รายการ ====================
  function loadList(){
    showPanel('list');
    setHtml('lyList', '<div class="empty">กำลังโหลด...</div>');
    ensureLinks().then(function(){ return api({ action: 'reviewList', t: tok.rl }); }).then(function(r){
      if (!r.success) throw new Error(r.error || 'โหลดไม่สำเร็จ');
      var list = r.receipts.filter(function(x){ return filter === 'all' || x.status === 'pending_review'; });
      var pending = r.receipts.filter(function(x){ return x.status === 'pending_review'; }).length;
      el('tabLoyaltyBtn').innerHTML = '🧾 ใบเสร็จ 7-Eleven' + (pending ? ' (' + pending + ')' : '');
      if (!list.length) { setHtml('lyList', '<div class="empty">' + (filter === 'all' ? 'ยังไม่มีใบเสร็จ' : '🎉 ไม่มีใบเสร็จรอตรวจ') + '</div>'); return; }
      setHtml('lyList', list.map(function(x){
        return '<div class="member-item" onclick="LY.open(\'' + x.id + '\')">'
          + '<div class="nm"><span class="ly-dot ' + h(x.aiVerdict) + '"></span>' + h(x.ref) + ' · ' + h(x.memberName || '-')
          + ' <span class="ly-st ' + h(x.status) + '">' + h(STATUS[x.status] || x.status) + '</span></div>'
          + '<div class="sub">' + dt(x.createdAt, true) + ' · เอมโอชา ' + (x.emochaAmount != null ? baht(x.emochaAmount) : '-')
          + ' · ' + (x.status === 'approved' ? 'ให้ ' + x.points : 'แนะนำ ' + x.suggestedPoints) + ' คะแนน</div></div>';
      }).join(''));
    }).catch(function(e){ fail('lyList', e); });
  }

  function showPanel(which){
    el('lyListCard').classList.toggle('sh', which !== 'list');
    el('lyDetailCard').classList.toggle('sh', which !== 'detail');
    el('lySettingsCard').classList.toggle('sh', which !== 'settings');
  }

  // ==================== ใบเสร็จ: รายละเอียด + อนุมัติ ====================
  function open(id){
    showPanel('detail');
    setHtml('lyDetailCard', '<div class="empty">กำลังโหลด...</div>');
    api({ action: 'review', id: id, lt: tok.rl }).then(function(r){
      if (!r.success) throw new Error(r.error || 'โหลดไม่สำเร็จ');
      receipt = r;
      renderDetail();
    }).catch(function(e){ fail('lyDetailCard', e); });
  }

  function renderDetail(){
    var d = receipt, r = d.receipt, m = r.member || {}, now = d.memberNow || {}, ai = (r.ai && r.ai.result) || null;
    var x = '<button class="btn btn-outline" style="padding:6px 12px;margin-bottom:10px" onclick="LY.loadList()">← กลับไปรายการ</button>';
    x += '<div class="ly-verdict ' + h(r.aiVerdict) + '">🧾 ' + h(r.ref) + ' · ' + h(STATUS[r.status] || r.status) + '<br><span style="font-weight:400">'
      + h(VERDICT[r.aiVerdict] || '') + ' · ส่งเมื่อ ' + dt(r.createdAt, true) + '</span></div>';
    var img = d.previewUrl || (r.fileMime && r.fileMime.indexOf('image/') === 0 ? d.fileUrl : '');
    x += '<div class="ly-img">' + (img ? '<img src="' + h(img) + '" alt="ใบเสร็จ" onclick="LY.zoom(this.src)">' : '')
      + (d.fileUrl ? '<a href="' + h(d.fileUrl) + '" target="_blank" rel="noopener">📄 เปิดไฟล์ต้นฉบับ (' + h(r.fileMime || '') + ')</a>' : '') + '</div>';
    x += '<div class="ly-sec">ผลอ่านใบเสร็จ</div><div class="member-info">'
      + row('สาขา', h(r.store || '-')) + row('เลขที่ใบเสร็จ', h(r.receiptNo || '-')) + row('วันที่ซื้อ', dt(r.receiptAt, true))
      + row('ยอดรวม', r.receiptTotal != null ? baht(r.receiptTotal) : '-')
      + row('ยอดสินค้าเอมโอชา', '<span style="color:#e8590c">' + (r.emochaAmount != null ? baht(r.emochaAmount) : '-') + '</span>')
      + row('คะแนนที่แนะนำ', r.suggestedPoints + ' คะแนน (' + h(d.bahtPerPoint) + ' บาท = 1)') + '</div>';
    if (r.emochaItems && r.emochaItems.length) {
      x += '<div class="ly-note">' + r.emochaItems.map(function(i){ return '• ' + h(i.name) + (i.qty ? ' × ' + h(i.qty) : '') + (i.amount ? ' = ' + baht(i.amount) : ''); }).join('<br>') + '</div>';
    }
    if (r.aiFlags && r.aiFlags.length) x += '<ul class="ly-flags">' + r.aiFlags.map(function(f){ return '<li>' + h(f) + '</li>'; }).join('') + '</ul>';
    if (ai && ai.summary_th) x += '<div class="ly-note">🤖 ' + h(ai.summary_th) + '</div>';
    if (d.related && d.related.length) {
      x += '<div class="ly-flags" style="background:#fff0f0;color:#c92a2a;padding-left:10px"><b>ใบที่อาจเป็นใบเดียวกัน</b><br>'
        + d.related.map(function(o){ return '<a href="#" onclick="LY.open(\'' + o.id + '\');return false">' + h(o.ref) + '</a> · ' + h(o.memberName || '-') + ' · ' + h(STATUS[o.status] || o.status); }).join('<br>') + '</div>';
    }
    var hist = d.history || {};
    x += '<div class="ly-sec">ลูกค้า</div><div class="member-info">'
      + row('ชื่อ', h(m.name || m.lineName || '-')) + row('รหัสสมาชิก', h(m.memberCode || '-')) + row('เบอร์โทร', h(m.phone || '-'))
      + row('คะแนนตอนนี้', (now.points != null ? Number(now.points).toLocaleString('th-TH') : '-') + ' คะแนน')
      + row('ใบเสร็จก่อนหน้า', (hist.total || 0) + ' ใบ (อนุมัติ ' + (hist.approved || 0) + ', ไม่ผ่าน ' + (hist.rejected || 0) + ')');
    (d.survey || []).forEach(function(q){ var a = (r.survey || {})[q.id]; if (a != null) x += row(q.q, h(Array.isArray(a) ? a.join(', ') : a)); });
    x += '</div><div id="lyDecide">' + decisionHtml(r) + '</div>';
    setHtml('lyDetailCard', x);
    if (r.status !== 'approved') setDecision('approve');
  }

  function decisionHtml(r){
    if (r.status === 'approved') {
      return '<div class="ly-sec">ผลการตรวจ</div><div class="member-info">'
        + row('สถานะ', '✅ อนุมัติแล้ว' + (r.reviewer ? ' โดย ' + h(r.reviewer) : ''))
        + row('คะแนนที่ให้', r.points + ' คะแนน')
        + row('เพิ่มคะแนนเข้าระบบ', r.pointsWrittenAt ? 'เรียบร้อย (คงเหลือ ' + h(r.balanceAfter) + ')' : '⏳ กำลังดำเนินการ' + (r.lastError ? ' — ' + h(r.lastError) : ''))
        + row('แจ้งลูกค้าทาง LINE', r.customerNotifiedAt ? 'ส่งแล้ว' : '⏳ รอส่ง') + '</div>';
    }
    var x = '';

  function reviewerName(){ try { return localStorage.getItem('emocha.reviewer') || ''; } catch (e) { return ''; } }
  function setDecision(dcs){
    decision = dcs;
    el('lyTabOk').classList.toggle('active', dcs === 'approve');
    el('lyTabNo').classList.toggle('active', dcs === 'reject');
    el('lyApprove').classList.toggle('sh', dcs !== 'approve');
    el('lyReject').classList.toggle('sh', dcs !== 'reject');
    var b = el('lyDecBtn');
    b.textContent = dcs === 'approve' ? '✅ อนุมัติและเพิ่มคะแนน' : '❌ ไม่อนุมัติ';
    b.style.background = dcs === 'approve' ? '' : '#c62828';
  }
  function decErr(m){ var e = el('lyDecErr'); e.textContent = m; e.classList.add('show'); }
  function submitDecision(){
    var r = receipt.receipt;
    var reviewer = el('lyReviewer').value.trim();
    if (!reviewer) return decErr('กรุณาใส่ชื่อผู้ตรวจ');
    try { localStorage.setItem('emocha.reviewer', reviewer); } catch (e) {}
    var params = { action: 'decide', id: r.id, lt: tok.rl, decision: decision, reviewer: reviewer };
    var msg;
    if (decision === 'approve') {
      var pts = parseInt(el('lyPoints').value, 10) || 0;
      if (pts <= 0) return decErr('กรุณาใส่คะแนนมากกว่า 0');
      params.points = pts;
      msg = 'อนุมัติ ' + r.ref + ' และเพิ่ม ' + pts + ' คะแนนให้ ' + ((r.member || {}).name || 'ลูกค้า') + '?';
    } else {
      var note = el('lyNote').value.trim();
      if (!note) return decErr('กรุณาใส่เหตุผลที่ไม่อนุมัติ');
      params.note = note;
      msg = 'ไม่อนุมัติ ' + r.ref + '?\nเหตุผล: ' + note;
    }
    confirmMsg(msg, function(){
      var b = el('lyDecBtn'); b.disabled = true; b.textContent = '⏳ กำลังบันทึก...';
      api(params).then(function(res){
        if (!res.success) { b.disabled = false; setDecision(decision); return decErr(res.error || 'บันทึกไม่สำเร็จ'); }
        receipt.receipt = Object.assign({}, r, res.receipt);
        renderDetail();
        alertMsg(decision === 'approve' ? '✅ อนุมัติแล้ว ระบบกำลังเพิ่มคะแนนและส่ง LINE แจ้งลูกค้า' : 'บันทึกว่าไม่อนุมัติแล้ว ระบบจะแจ้งลูกค้าทาง LINE');
      }).catch(function(e){ b.disabled = false; setDecision(decision); decErr('เชื่อมต่อไม่สำเร็จ: ' + e.message); });
    });
  }

  function summaryHtml(){
    var sum = settings.surveySummary || {}, qs = settings.settings.survey || [];
    var ids = Object.keys(sum);
    if (!ids.length) return '<div class="hint">ยังไม่มีคำตอบ</div>';
    return ids.map(function(id){
      var q = qs.filter(function(z){ return z.id === id; })[0];
      var rows = sum[id] || [], max = Math.max.apply(null, rows.map(function(r){ return r.count; }).concat([1]));
      return '<div class="ly-bars"><b>' + h(q ? q.q : id) + '</b>' + rows.map(function(r){
        return '<div class="r"><span class="l">' + h(r.answer) + '</span><span class="t"><i style="width:' + Math.round(r.count / max * 100) + '%"></i></span><span>' + r.count + '</span></div>';
      }).join('') + '</div>';
    }).join('');
  }
  function readSurvey(){
    document.querySelectorAll('#lySurvey .ly-q').forEach(function(q, i){
      survey[i].q = q.querySelector('[data-f=q]').value;
      survey[i].type = q.querySelector('[data-f=type]').value;
      survey[i].required = q.querySelector('[data-f=req]').checked;
      survey[i].options = q.querySelector('[data-f=opt]').value.split('\n').map(function(t){ return t.trim(); }).filter(Boolean);
    });
  }
  function renderSurvey(){

      return '<div class="ly-q"><div class="ly-q-hd"><span>ข้อ ' + (i + 1) + '</span>'
        + '<button type="button" class="btn-on" onclick="LY.moveQ(' + i + ',-1)"' + (i === 0 ? ' disabled' : '') + '>↑</button>'
        + '<button type="button" class="btn-on" onclick="LY.moveQ(' + i + ',1)"' + (i === survey.length - 1 ? ' disabled' : '') + '>↓</button>'
        + '<button type="button" class="btn-del" onclick="LY.delQ(' + i + ')">ลบ</button></div>'

  function moveQ(i, d){ readSurvey(); var t = survey[i]; survey[i] = survey[i + d]; survey[i + d] = t; renderSurvey(); }
  function saveSettings(){
    readSurvey();

      baht_per_point: Number(v('lyBpp')), max_per_day: Number(v('lyMaxDay')), max_receipt_age_days: Number(v('lyMaxAge')),
      sender: { name: v('lySndName'), phone: v('lySndPhone'), address: v('lySndAddr') },
      product_keywords: v('lyKeywords').split('\n').map(function(t){ return t.trim(); }).filter(Boolean),
      survey: survey.map(function(q){ return { id: q.id, q: String(q.q || '').trim(), type: q.type, required: !!q.required, options: q.options }; })
    };
    var b = el('lyCfgSave'); b.disabled = true; b.textContent = '⏳ กำลังบันทึก...';
    api({ action: 'settingsSave', t: tok.cfg, settings: JSON.stringify(payload) }).then(function(r){
      b.disabled = false; b.textContent = '💾 บันทึกการตั้งค่า';

      renderSettings();

    }).catch(function(e){ b.disabled = false; b.textContent = '💾 บันทึกการตั้งค่า'; var x = el('lyCfgErr'); x.textContent = 'เชื่อมต่อไม่สำเร็จ: ' + e.message; x.classList.add('show'); });
  }

  function printSelected(){
    var ids = Array.prototype.map.call(document.querySelectorAll('.ly-pick:checked'), function(x){ return x.value; });
    var picked = shipments.filter(function(s){ return ids.indexOf(s.id) !== -1; });
    if (!picked.length) return alertMsg('กรุณาติ๊กเลือกรายการที่จะพิมพ์');
    setHtml('lyPrintArea', picked.map(labelHtml).join(''));
    document.body.classList.add('ly-printing');
    setTimeout(function(){
      window.print();
      document.body.classList.remove('ly-printing');
      var toMark = picked.filter(function(s){ return s.status === 'pending'; });
      if (toMark.length) confirmMsg('พิมพ์เรียบร้อยไหม? กดยืนยันเพื่อเปลี่ยน ' + toMark.length + ' รายการเป็น "พิมพ์แล้ว"', function(){

    loadList: loadList, open: open, setFilter: function(v){ filter = v; loadList(); }, setDecision: setDecision,
    bump: function(n){ var x = el('lyPoints'); x.value = Math.max(1, (parseInt(x.value, 10) || 0) + n); },
